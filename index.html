onteks zaman, misalnya kefasihan bahasa Arab menjadi mukjizat Al-Qur'an pada masa Nabi Muhammad ﷺ yang dikenal sebagai bangsa yang mahir bersastra.", "ar": null, "img": null}, {"type": "pg", "subject": "PAI", "cat": "Sejarah Peradaban Islam", "level": "HOTS", "q": "Kondisi bangsa Arab sebelum Islam yang dikenal dengan zaman jahiliah ditandai dengan kebiasaan ...", "opts": ["Menyembah berhala dan sering berperang antarsuku", "Hidup damai dan makmur", "Menganut satu agama yang benar", "Memiliki sistem pendidikan modern"], "ans": 0, "hint": "Zaman jahiliah ditandai dengan penyembahan berhala, peperangan antarsuku, dan berbagai kebiasaan buruk sebelum Islam datang.", "ar": null, "img": null}, {"type": "pg", "subject": "PAI", "cat": "Sejarah Peradaban Islam", "level": "Rendah", "q": "Nabi Muhammad ﷺ diasuh oleh seorang perempuan dari Bani Sa'ad bernama ...", "opts": ["Aminah", "Halimatus Sa'diyah", "Khadijah", "Ummu Aiman"], "ans": 1, "hint": "Nabi Muhammad ﷺ disusui dan diasuh oleh Halimatus Sa'diyah pada masa kanak-kanak sebelum kembali kepada ibunya.", "ar": null, "img": null}, {"type": "pg", "subject": "PAI", "cat": "Sejarah Peradaban Islam", "level": "HOTS", "q": "Sejak kecil, Nabi Muhammad ﷺ telah kehilangan ayah, ibu, dan kakeknya, kemudian diasuh oleh pamannya Abu Thalib. Keteladanan yang dapat dipetik dari masa kecil beliau yang penuh ujian ini adalah ...", "opts": ["Menyerah dan berputus asa saat menghadapi cobaan hidup", "Tetap tumbuh menjadi pribadi yang tegar, jujur, dan berakhlak mulia meski menghadapi banyak ujian", "Menyalahkan keadaan dan orang lain", "Menjauhi masyarakat karena merasa berbeda"], "ans": 1, "hint": "Meski menghadapi banyak ujian sejak kecil, Nabi Muhammad ﷺ tetap tumbuh menjadi pribadi yang tegar, jujur, dan berakhlak mulia, menjadi teladan dalam menghadapi kesulitan hidup.", "ar": null, "img": null}, {"type": "pg", "subject": "PAI", "cat": "Sejarah Peradaban Islam", "level": "Sedang", "q": "Peristiwa hijrah Nabi Muhammad ﷺ ke Madinah terjadi karena ...", "opts": ["Ingin berdagang di Madinah", "Tekanan dan ancaman kaum kafir Quraisy yang semakin berat di Makkah", "Diusir oleh keluarganya sendiri", "Mencari harta kekayaan"], "ans": 1, "hint": "Hijrah dilakukan untuk menyelamatkan diri dan para pengikutnya dari tekanan kaum Quraisy sekaligus mencari tempat dakwah yang lebih kondusif.", "ar": null, "img": null}, {"type": "bs", "subject": "PAI", "cat": "Sejarah Peradaban Islam", "level": "HOTS", "q": "Perjuangan Rasulullah dalam peristiwa Fathu Makkah dilakukan dengan penuh kedamaian dan pemberian maaf kepada penduduk Makkah.", "val": true, "hint": "Benar. Nabi ﷺ menaklukkan Makkah hampir tanpa peperangan dan memaafkan penduduknya yang dahulu memusuhinya.", "ar": null, "img": null}, {"type": "pg", "subject": "PAI", "cat": "Sejarah Peradaban Islam", "level": "HOTS", "q": "Setelah diangkat menjadi rasul, Nabi Muhammad ﷺ mulai berdakwah secara sembunyi-sembunyi sebelum secara terang-terangan. Hikmah utama dari tahapan dakwah ini adalah ...", "opts": ["Menunjukkan keraguan Nabi dalam berdakwah", "Melindungi keselamatan pengikut awal yang masih sedikit sekaligus mempersiapkan fondasi keimanan yang kokoh", "Ajaran Islam belum sempurna saat itu", "Tidak ada strategi khusus, hanya kebetulan"], "ans": 1, "hint": "Tahapan dakwah sembunyi-sembunyi bertujuan melindungi keselamatan pengikut awal yang jumlahnya masih sedikit, sekaligus mempersiapkan fondasi keimanan yang kuat sebelum menghadapi tantangan dakwah terbuka.", "ar": null, "img": null}, {"type": "pg", "subject": "PAI", "cat": "Sejarah Peradaban Islam", "level": "Sedang", "q": "Kota Madinah sebelum kedatangan Nabi Muhammad ﷺ dikenal dengan nama ...", "opts": ["Yatsrib", "Thaif", "Hijaz", "Najran"], "ans": 0, "hint": "Madinah sebelumnya bernama Yatsrib, kemudian berganti nama menjadi Madinah setelah kedatangan Nabi ﷺ.", "ar": null, "img": null}, {"type": "pg", "subject": "PAI", "cat": "Sejarah Peradaban Islam", "level": "HOTS", "q": "Kisah keteladanan Khulaf an kaum pada zamannya, seperti sihir pada masa Nabi Musa dan pengobatan/sastra pada masa Nabi Isa dan Muhammad ﷺ.", "ar": null, "img": null}, {"type": "pg", "subject": "PAI", "cat": "Sejarah Peradaban Islam", "level": "Sedang", "q": "Sebelum Islam datang, masyarakat Arab dikenal memiliki tradisi buruk berupa ...", "opts": ["Mengubur bayi perempuan hidup-hidup", "Mendirikan sekolah untuk semua anak", "Menghormati hak perempuan secara penuh", "Menerapkan sistem hukum yang adil"], "ans": 0, "hint": "Salah satu tradisi buruk zaman jahiliah adalah mengubur bayi perempuan hidup-hidup karena dianggap aib, yang kemudian dihapuskan oleh ajaran Islam.", "ar": null, "img": null}, {"type": "pg", "subject": "PAI", "cat": "Sejarah Peradaban Islam", "level": "Rendah", "q": "Nabi Muhammad ﷺ lahir dalam keadaan yatim karena ...", "opts": ["Ayahnya, Abdullah, telah wafat sebelum beliau lahir", "Ibunya wafat saat melahirkan", "Kedua orang tuanya wafat bersamaan", "Diserahkan kepada orang lain sejak lahir"], "ans": 0, "hint": "Ayah Nabi Muhammad ﷺ, Abdullah, wafat sebelum beliau dilahirkan, sehingga beliau lahir dalam keadaan yatim.", "ar": null, "img": null}, {"type": "pg", "subject": "PAI", "cat": "Sejarah Peradaban Islam", "level": "HOTS", "q": "Masa kanak-kanak Nabi Muhammad ﷺ diwarnai berbagai kehilangan: ayah sebelum lahir, ibu di usia 6 tahun, dan kakek di usia 8 tahun. Meski demikian, beliau tumbuh menjadi pribadi yang mulia. Pelajaran penting bagi siswa dari kisah ini adalah ...", "opts": ["Kesulitan hidup adalah alasan untuk menyerah", "Ujian hidup yang berat tidak menghalangi seseorang untuk tumbuh menjadi pribadi mulia jika disikapi dengan sabar dan tawakal", "Anak yatim tidak bisa berhasil", "Kehilangan orang tua membuat seseorang menjadi buruk"], "ans": 1, "hint": "Kisah masa kecil Nabi ﷺ mengajarkan bahwa ujian hidup yang berat dapat dihadapi dengan sabar dan tawakal, sehingga seseorang tetap dapat tumbuh menjadi pribadi yang mulia dan berakhlak baik.", "ar": null, "img": null}, {"type": "pg", "subject": "PAI", "cat": "Sejarah Peradaban Islam", "level": "Sedang", "q": "Wahyu pertama yang diterima Nabi Muhammad ﷺ di Gua Hira adalah surah ...", "opts": ["Al-'Alaq ayat 1-5", "Al-Fatihah", "Al-Muddassir", "Al-Baqarah"], "ans": 0, "hint": "Wahyu pertama yang diterima Nabi Muhammad ﷺ adalah surah Al-'Alaq ayat 1-5, menandai diangkatnya beliau sebagai rasul.", "ar": null, "img": null}, {"type": "pg", "subject": "PAI", "cat": "Sejarah Peradaban Islam", "level": "HOTS", "q": "Setelah menerima wahyu pertama, Nabi Muhammad ﷺ sempat merasa cemas dan gemetar, lalu ditenangkan oleh istrinya, Khadijah r.a. Peran Khadijah dalam peristiwa ini menunjukkan pentingnya ...", "opts": ["Dukungan keluarga dalam menghadapi tugas berat dan situasi yang menegangkan", "Mengabaikan perasaan orang lain", "Bersikap acuh terhadap masalah orang terdekat", "Menyalahkan situasi tanpa memberi solusi"], "ans": 0, "hint": "Dukungan dan ketenangan yang diberikan Khadijah r.a. kepada Nabi ﷺ menunjukkan pentingnya peran keluarga dalam memberikan dukungan emosional saat menghadapi tugas berat atau situasi yang menegangkan.", "ar": null, "img": null}, {"type": "pg", "subject": "PAI", "cat": "Sejarah Peradaban Islam", "level": "HOTS", "q": "Nabi Muhammad ﷺ membangun Kota Madinah dengan mendirikan masjid dan mempersaudarakan ...", "opts": ["Kaum Muhajirin dan Anshar", "Kaum Quraisy dan Yahudi", "Kaum Persia dan Romawi", "Kaum Badui dan perkotaan"], "ans": 0, "hint": "Nabi ﷺ mempersaudarakan kaum Muhajirin (pendatang dari Makkah) dengan kaum Anshar (penduduk asli Madinah) sebagai fondasi masyarakat baru.", "ar": null, "img": null}, {"type": "bs", "subject": "PAI", "cat": "Sejarah Peradaban Islam", "level": "HOTS", "q": "Perjuangan Rasulullah dalam Fathu Makkah menunjukkan bahwa kemenangan sejati dapat diraih tanpa kekerasan berlebihan dan disertai sikap pemaaf.", "val": true, "hint": "Benar. Nabi ﷺ menaklukkan Makkah hampir tanpa peperangan dan memaafkan penduduknya, menunjukkan akhlak mulia dalam meraih kemenangan.", "ar": null, "img": null}, {"type": "pg", "subject": "PAI", "cat": "Sejarah Peradaban Islam", "level": "HOTS", "q": "Keteladanan Khulafaur Rasyidin dalam memimpin dapat dijadikan inspirasi bagi ketua kelas di sekolah. Sikap paling relevan yang bisa diterapkan adalah ...", "opts": ["Bersikap otoriter demi ketertiban", "Adil, mendengarkan pendapat teman, dan bertanggung jawab atas keputusan bersama", "Mementingkan kelompok tertentu saja", "Menghindari tanggung jawab yang sulit"], "ans": 1, "hint": "Keteladanan Khulafaur Rasyidin dalam bersikap adil dan bertanggung jawab dapat diterapkan oleh ketua kelas dengan mendengarkan pendapat teman dan mengambil keputusan yang adil bagi semua.", "ar": null, "img": null}, {"type": "pg", "subject": "PAI", "cat": "Sejarah Peradaban Islam", "level": "Sedang", "q": "Salah satu jasa besar Khalifah Umar bin Khattab bagi peradaban Islam adalah ...", "opts": ["Memperluas wilayah Islam dan menata sistem pemerintahan", "Membukukan mushaf Al-Qur'an", "Menjadi khalifah pertama", "Terkenal dengan keahlian di bidang hukum"], "ans": 0, "hint": "Umar bin Khattab dikenal memperluas wilayah kekuasaan Islam secara signifikan dan menata berbagai sistem pemerintahan dan administrasi negara.", "ar": null, "img": null}, {"type": "pg", "subject": "BTQ", "cat": "Hukum Nun Sukun dan Tanwin", "level": "Rendah", "q": "Hukum bacaan nun sukun dan tanwin terbagi menjadi empat, yaitu izhar, idgham, iqlab, dan ...", "opts": ["Ikhfa", "Qalqalah", "Mad", "Ghunnah"], "ans": 0, "hint": "Empat hukum nun sukun/tanwin: izhar halqi, idgham (bighunnah/bilaghunnah), iqlab, dan ikhfa haqiqi.", "ar": null, "img": null}, {"type": "pg", "subject": "BTQ", "cat": "Hukum Nun Sukun dan Tanwin", "level": "Sedang", "q": "Perhatikan lafal berikut, tentukan hukum bacaannya!", "opts": ["Idgham bighunnah", "Ikhfa haqiqi", "Izhar halqi", "Iqlab"], "ans": 2, "hint": "Nun sukun bertemu huruf ha (ه) yang termasuk huruf halq, dibaca izhar halqi (jel ue, "hint": "Benar. Sedekah yang disertai keinginan dipuji dan selalu diceritakan kepada orang lain termasuk riya, yang dapat mengurangi bahkan menghilangkan pahala sedekah tersebut.", "ar": null, "img": null}, {"type": "pg", "subject": "PAI", "cat": "Akhlak", "level": "Sedang", "q": "Membantu tetangga yang kesulitan membawa barang belanjaan tanpa diminta termasuk sikap ...", "opts": ["Menolong", "Sombong", "Munafik", "Riya"], "ans": 0, "hint": "Menolong sesama secara sukarela, bahkan tanpa diminta, adalah akhlak terpuji yang sangat dianjurkan.", "ar": null, "img": null}, {"type": "pg", "subject": "PAI", "cat": "Akhlak", "level": "HOTS", "q": "Di lingkungan rumah, Ani yang muslim sering bermain dan belajar bersama Ling-ling yang beragama Buddha tanpa mempermasalahkan perbedaan keyakinan. Sikap Ani ini adalah teladan dari ...", "opts": ["Munafik", "Berteman tanpa membedakan agama", "Fanatisme", "Eksklusivisme"], "ans": 1, "hint": "Islam mengajarkan untuk tetap bergaul, bermain, dan belajar bersama siapa pun tanpa membedakan agama, selama tidak mencampuri akidah dan ibadah masing-masing.", "ar": null, "img": null}, {"type": "pg", "subject": "PAI", "cat": "Fiqih", "level": "Rendah", "q": "Azan dikumandangkan sebagai tanda ...", "opts": ["Masuknya waktu shalat", "Berakhirnya shalat", "Dimulainya puasa", "Selesainya puasa"], "ans": 0, "hint": "Azan dikumandangkan sebagai tanda telah masuknya waktu shalat fardu.", "ar": null, "img": null}, {"type": "pg", "subject": "PAI", "cat": "Fiqih", "level": "Sedang", "q": "Perbedaan azan dan iqamah terletak pada ...", "opts": ["Iqamah dikumandangkan sesaat sebelum shalat dimulai, azan menandai masuknya waktu shalat", "Keduanya sama persis", "Azan hanya untuk shalat Jumat", "Iqamah dikumandangkan setelah shalat selesai"], "ans": 0, "hint": "Azan dikumandangkan untuk menandai masuknya waktu shalat, sedangkan iqamah dikumandangkan sesaat sebelum shalat berjamaah dimulai.", "ar": null, "img": null}, {"type": "pg", "subject": "PAI", "cat": "Fiqih", "level": "HOTS", "q": "Seorang anak perempuan berusia 10 tahun bertanya kepada ibunya kapan ia akan dianggap balig. Jawaban paling tepat yang dapat diberikan adalah ...", "opts": ["Pada usia 15 tahun tanpa syarat lain", "Ketika mengalami tanda balig seperti haid, yang waktunya bisa berbeda-beda tiap anak", "Balig hanya berlaku bagi laki-laki", "Tidak ada tanda khusus, hanya menunggu usia dewasa"], "ans": 1, "hint": "Balig bagi perempuan umumnya ditandai dengan haid, dan waktunya dapat berbeda-beda pada setiap anak, tidak selalu sama dengan usia tertentu.", "ar": null, "img": null}, {"type": "bs", "subject": "PAI", "cat": "Fiqih", "level": "Rendah", "q": "Zakat termasuk salah satu rukun Islam yang wajib ditunaikan oleh setiap muslim yang mampu.", "val": true, "hint": "Benar. Zakat adalah rukun Islam ketiga yang wajib ditunaikan oleh muslim yang telah memenuhi syarat.", "ar": null, "img": null}, {"type": "pg", "subject": "PAI", "cat": "Fiqih", "level": "HOTS", "q": "Sedekah yang diberikan secara diam-diam tanpa diketahui orang lain memiliki keutamaan karena ...", "opts": ["Lebih menjaga keikhlasan dan terhindar dari riya", "Tidak sah jika diketahui orang lain", "Wajib dirahasiakan selamanya", "Nilainya lebih kecil dari sedekah terang-terangan"], "ans": 0, "hint": "Sedekah secara diam-diam membantu menjaga keikhlasan hati dan terhindar dari sifat riya (ingin dipuji).", "ar": null, "img": null}, {"type": "pg", "subject": "PAI", "cat": "Fiqih", "level": "HOTS", "q": "Seorang siswa ditawari camilan oleh penjual di pinggir jalan, namun kemasannya tidak memiliki label halal yang jelas. Sikap paling bijak yang sebaiknya dilakukan adalah ...", "opts": ["Langsung membelinya karena terlihat enak", "Mencari informasi kejelasan bahan dan kehalalannya terlebih dahulu sebelum membeli", "Membelinya lalu membuang jika ragu", "Mengabaikan aspek kehalalan karena hanya camilan kecil"], "ans": 1, "hint": "Sikap kehati-hatian (wara') mengajarkan untuk memastikan kejelasan status halal suatu makanan sebelum mengonsumsinya, guna menjaga diri dari yang haram atau syubhat.", "ar": null, "img": null}, {"type": "pg", "subject": "PAI", "cat": "Fiqih", "level": "Sedang", "q": "Bersuci dari hadas dan najis merupakan syarat sah ...", "opts": ["Shalat", "Puasa saja", "Zakat", "Sedekah"], "ans": 0, "hint": "Bersuci dari hadas dan najis adalah salah satu syarat sah shalat yang harus dipenuhi.", "ar": null, "img": null}, {"type": "bs", "subject": "PAI", "cat": "Fiqih", "level": "HOTS", "q": "Tayamum dilakukan dengan mengusapkan debu suci ke wajah dan kedua tangan sebagai pengganti wudu ketika tidak ada air.", "val": true, "hint": "Benar. Tata cara tayamum meliputi mengusap wajah dan kedua tangan dengan debu suci sebagai pengganti wudu.", "ar": null, "img": null}, {"type": "pg", "subject": "PAI", "cat": "Fiqih", "level": "Rendah", "q": "Ucapan 'Allahu Akbar' termasuk bacaan zikir yang disebut ...", "opts": ["Takbir", "Tahmid", "Tasbih", "Tahlil"], "ans": 0, "hint": "Allahu Akbar adalah bacaan takbir, salah satu bentuk zikir yang mengagungkan kebesaran Allah.", "ar": null, "img": null}, {"type": "pg", "subject": "PAI", "cat": "Fiqih", "level": "HOTS", "q": "Setelah menyelesaikan shalat, seorang siswa langsung bergegas pergi tanpa berzikir atau berdoa karena terburu-buru. Dampak yang mungkin terlewat dari kebiasaan ini adalah ...", "opts": ["Tidak ada dampak apa pun", "Kehilangan momen berharga untuk memohon keberkahan dan mendekatkan diri kepada Allah setelah beribadah", "Shalatnya menjadi batal", "Wajib mengulang shalat dari awal"], "ans": 1, "hint": "Zikir dan doa setelah shalat adalah momen berharga untuk memohon keberkahan dan mendekatkan diri kepada Allah; melewatkannya berarti kehilangan kesempatan tersebut meski shalatnya tetap sah.", "ar": null, "img": null}, {"type": "pg", "subject": "PAI", "cat": "Fiqih", "level": "Sedang", "q": "Shalat rawatib yang dikerjakan sebelum shalat fardu disebut shalat rawatib ...", "opts": ["Qabliyah", "Ba'diyah", " /* ===================== SEQUENCE BUILDING ===================== */
function buildSequence(pkg){
  var pai = pkg.items.filter(function(it){return it.subject==='PAI';});
  var btq = pkg.items.filter(function(it){return it.subject==='BTQ';});
  var paiMatch = pkg.matches.filter(function(m){return m.subject==='PAI';})[0];
  var btqMatch = pkg.matches.filter(function(m){return m.subject==='BTQ';})[0];
  var seq = [];
  pai.forEach(function(it){ seq.push(Object.assign({kind:'item'}, it)); });
  seq.push(Object.assign({kind:'match'}, paiMatch));
  btq.forEach(function(it){ seq.push(Object.assign({kind:'item'}, it)); });
  seq.push(Object.assign({kind:'match'}, btqMatch));
  return seq;
}

// compute soal number range [start,end] (1-indexed, inclusive) for each sequence index
function soalRanges(seq){
  var ranges = []; var n = 1;
  seq.forEach(function(node){
    if(node.kind==='item'){ ranges.push([n,n]); n++; }
    else { var cnt = node.pairs.length; ranges.push([n, n+cnt-1]); n += cnt; }
  });
  return ranges;
}

  html += '<div class="pkg-grid">';
  PKG_NAMES.forEach(function(name){
    html += '<div class="pkg-card" data-pkg="'+name+'"><div class="pkg-letter">'+name.replace('Paket ','')+'</div>'+
      '<div class="pkg-body"><h3>'+name+'</h3><p>75 PAI + 25 BTQ · 100 soal</p><p style="color:var(--gold-600);font-weight:700;margin-top:2px">'+PKG_META[name]+'</p></div>'+
      '<div class="pkg-arrow">&#8250;</div></div>';
  });
  html += '</div>';
  html += '<div class="spec-box"><b>Ruang lingkup:</b> Al-Qur\u2019an Hadits, Aqidah, Akhlak, Fiqih, Sejarah Peradaban Islam (PAI), serta Tajwid &amp; Huruf Hijaiah (BTQ) — sesuai Blue Print Lomba MAPSI XXVII 2026.'+
    '<div class="spec-grid"><div>• 70% Pilihan Ganda</div><div>• 50% Level Tinggi (HOTS)</div><div>• 20% Benar-Salah</div><div>• 30% Level Sedang</div><div>• 10% Menjodohkan</div><div>• 20% Level Rendah</div></div></div>';
  mainArea.innerHTML = html;
  Array.prototype.forEach.call(document.querySelectorAll('.pkg-card'), function(el){
    el.addEventListener('click', function(){ startPackage(el.getAttribute('data-pkg')); });
  });
}

/* ===================== START PACKAGE ===================== */
function startPackage(name){
  var pkg = BANK[name];
  var seq = buildSequence(pkg);
  STATE = {
    screen:'quiz', pkgName:name, pkg:pkg, sequence:seq, seqIndex:0,
    answers:{}, hintShown:{}, timerSeconds:90*60, timerId:null, navOpen:false, resultTab:'all',
    ranges: soalRanges(seq)
  };
  topActions.style.display = 'flex';
  topTitle.textContent = name;
  topSub.textContent = 'PAI-BTQ MAPSI XXVII';
  startTimer();
  renderQuiz();
}

/* ===================== TIMER ===================== */
function startTimer(){
  stopTimer();
  updateTimerDisplay();
  STATE.timerId = setInterval(function(){
    STATE.timerSeconds--;
    updateTimerDisplay();
  }, 1000);
}
function stopTimer(){ if(STATE.timerId){ clearInterval(STATE.timerId); STATE.timerId=null; } }
function updateTimerDisplay(){
  var s = STATE.timerSeconds;
  var over = s < 0;
  var abs = Math.abs(s);
  var mm = Math.floor(abs/60), ss = abs%60;
  var txt = (over?'+':'') + String(mm).padStart(2,'0') + ':' + String(ss).padStart(2,'0');
  timerChip.textContent = txt;
  timerChip.classList.toggle('over', over);
  overtimeBanner.style.display = over ? 'block' : 'none';
}

/* ===================== QUIZ RENDER ===================== */
function currentRange(){ return STATE.ranges[STATE.seqIndex]; }

function renderQuiz(){
  var node = STATE.sequence[STATE.seqIndex];
  if(node.kind==='item') renderItem(node);
  else renderMatch(node);
}

function progressHtml(node, extraBadges){
  var range = currentRange();
  var label = range[0]===range[1] ? ('Soal '+range[0]) : ('Soal '+range[0]+'\u2013'+range[1]);
  var pctBase = (range[0]-1)/100*100;
  var badges = '<span class="badge subject-'+node.subject+'">'+node.subject+'</span>';
  if(extraBadges) badges += extraBadges;
  return '<div class="progress-wrap"><div class="progress-top"><div class="badges">'+badges+'</div>'+
    '<span class="count">'+label+' / 100</span></div>'+
    '<div class="progress-track"><div class="progress-fill" style="width:'+pctBase+'%"></div></div></div>';
}

function renderItem(item){
  var idx = STATE.seqIndex;
  var answered = STATE.answers[idx];
  var lvlBadge = '<span class="badge lvl-'+item.level+'">'+item.level+'</span>';
  var html = progressHtml(item, lvlBadge);
  html += '<div class="qcard"><div class="qcat">'+esc(item.cat)+'</div><p class="qtext">'+esc(item.q)+'</p>';

  if(item.ar){ html += '<div class="ayat-box"><p class="arabic">'+item.ar+'</p></div>'; }
  if(item.img && typeof ICONS!=='undefined' && ICONS[item.img]){ html += '<figure class="q-img">'+ICONS[item.img]()+'</figure>'; }

  if(item.type==='pg'){
    html += '<div class="opts">';
    var letters=['A','B','C','D'];
    item.opts.forEach(function(opt,oi){
      var cls='opt'+(answered===oi?' selected':'');
      html += '<button class="'+cls+'" data-oi="'+oi+'"><span class="tag">'+letters[oi]+'</span><span>'+esc(opt)+'</span></button>';
    });
    html += '</div>';
  } else {
    var selT = answered===true, selF = answered===false;
    html += '<div class="bs-opts">'+
      '<button class="bs-opt true'+(selT?' selected':'')+'" data-val="true">BENAR</button>'+
      '<button class="bs-opt false'+(selF?' selected':'')+'" data-val="false">SALAH</button>'+
      '</div>';
  }

  html += '<button class="hint-toggle" id="hintBtn">'+(STATE.hintShown[idx] ? 'Sembunyikan Kunci & Pembahasan' : '\uD83D\uDCA1 Lihat Kunci & Pembahasan (Hint)')+'</button>';
  if(STATE.hintShown[idx]){
    var keyTxt = item.type==='pg' ? item.opts[item.ans] : (item.val ? 'BENAR' : 'SALAH');
    html += '<div class="hint-box"><span class="hk">Kunci jawaban: '+esc(keyTxt)+'</span>'+esc(item.hint)+'</div>';
  }

  html += '<div class="nav-row">';
  if(idx>0) html += '<button class="btn btn-ghost" id="prevBtn">Sebelumnya</button>';
  html += '<button class="btn btn-primary" id="nextBtn">'+(idx===STATE.sequence.length-1?'Selesai & Lihat Hasil':'Soal Berikutnya')+'</button>';
  html += '</div></div>';

  mainArea.innerHTML = html;

  if(item.type==='pg'){
    Array.prototype.forEach.call(document.querySelectorAll('.opt'), function(btn){
      btn.addEventListener('click', function(){
        STATE.answers[idx] = parseInt(btn.getAttribute('data-oi'),10);
        renderItem(item);
      });
    });
  } else {
    Array.prototype.forEach.call(document.querySelectorAll('.bs-opt'), function(btn){
      btn.addEventListener('click', function(){
        STATE.answers[idx] = btn.getAttribute('data-val')==='true';
        renderItem(item);
      });
    });
  }
  document.getElementById('hintBtn').addEventListener('click', function(){
    STATE.hintShown[idx] = !STATE.hintShown[idx];
    renderItem(item);
  });
  var prevBtn = document.getElementById('prevBtn');
  if(prevBtn) prevBtn.addEventListener('click', function(){ STATE.seqIndex--; renderQuiz(); });
  document.getElementById('nextBtn').addEventListener('click', function(){
    if(idx===STATE.sequence.length-1){ finishQuiz(); }
    else { STATE.seqIndex++; renderQuiz(); }
  });
}

/* ===================== MATCH RENDER ===================== */
function renderMatch(node){
  var idx = STATE.seqIndex;
  if(!STATE.answers[idx]) STATE.answers[idx] = { leftLinks:{}, rightOrder: shuffle(node.pairs.map(function(_,i){return i;})) };
  var st = STATE.answers[idx];
  var lvlBadge = '<span class="badge lvl-'+node.level+'">'+node.level+'</span>';
  var html = progressHtml(node, lvlBadge);
  html += '<p class="match-instructions"><b>'+esc(node.title)+'</b><br>Ketuk item Kolom A lalu ketuk pasangannya di Kolom B untuk menariknya menjadi garis.</p>';
  html += '<div class="match-wrap" id="matchWrap"><svg id="lineSvg"></svg><div class="match-cols">';

  html += '<div class="match-col left">';
  node.pairs.forEach(function(p,li){
    var linked = st.leftLinks[li]!==undefined;
    var active = st.activeLeft===li;
    html += '<div class="match-item'+(linked?' linked':'')+(active?' active':'')+'" data-left="'+li+'"><span class="dot"></span><span>'+esc(p[0])+'</span></div>';
  });
  html += '</div><div class="match-col right">';
  st.rightOrder.forEach(function(origIdx){
    var used = Object.keys(st.leftLinks).some(function(l){return st.leftLinks[l]===origIdx;});
    html += '<div class="match-item'+(used?' linked':'')+'" data-right="'+origIdx+'"><span>'+esc(node.pairs[origIdx][1])+'</span><span class="dot"></span></div>';
  });
  html += '</div></div></div>';

  var allLinked = Object.keys(st.leftLinks).length===node.pairs.length;
  html += '<div class="match-toolbar"><button class="btn btn-ghost" id="resetMatch">Reset</button>'+
    '<button class="btn btn-primary" id="nextMatch">'+(idx===STATE.sequence.length-1?'Selesai & Lihat Hasil':'Soal Berikutnya')+'</button></div>';

  html += '<button class="hint-toggle" id="hintBtn" style="margin-top:12px">'+(STATE.hintShown[idx]?'Sembunyikan Kunci':'\uD83D\uDCA1 Lihat Kunci (Hint)')+'</button>';
  if(STATE.hintShown[idx]){
    var lines = node.pairs.map(function(p){ return esc(p[0])+' \u2192 '+esc(p[1]); }).join('<br>');
    html += '<div class="hint-box"><span class="hk">Kunci pasangan yang benar:</span>'+lines+'</div>';
  }
  if(idx>0) html = html.replace('<div class="match-toolbar">', '<div class="match-toolbar"><button class="btn btn-ghost" id="prevBtn">Sebelumnya</button>');

  mainArea.innerHTML = html;

  Array.prototype.forEach.call(document.querySelectorAll('.match-col.left .match-item'), function(el){
    el.addEventListener('click', function(){ st.activeLeft = parseInt(el.getAttribute('data-left'),10); renderMatch(node); });
  });
  Array.prototype.forEach.call(document.querySelectorAll('.match-col.right .match-item'), function(el){
    el.addEventListener('click', function(){
      if(st.activeLeft===null || st.activeLeft===undefined) return;
      var ri = parseInt(el.getAttribute('data-right'),10);
      Object.keys(st.leftLinks).forEach(function(l){ if(st.leftLinks[l]===ri) delete st.leftLinks[l]; });
      st.leftLinks[st.activeLeft] = ri;
      st.activeLeft = null;
      renderMatch(node);
    });
  });
  document.getElementById('resetMatch').addEventListener('click', function(){ st.leftLinks={}; st.activeLeft=null; renderMatch(node); });
  document.getElementById('hintBtn').addEventListener('click', function(){ STATE.hintShown[idx]=!STATE.hintShown[idx]; renderMatch(node); });
  var prevBtn = document.getElementById('prevBtn');
  if(prevBtn) prevBtn.addEventListener('click', function(){ STATE.seqIndex--; renderQuiz(); });
  document.getElementById('nextMatch').addEventListener('click', function(){
    if(idx===STATE.sequence.length-1){ finishQuiz(); }
    else { STATE.seqIndex++; renderQuiz(); }
  });

  drawLines();
  window.addEventListener('resize', function(){ if(STATE.screen==='quiz') drawLines(); });
}

function shuffle(arr){ for(var i=arr.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=arr[i]; arr[i]=arr[j]; arr[j]=t; } return arr; }

function drawLines(){
  var wrap = document.getElementById('matchWrap'); var svg = document.getElementById('lineSvg');
  if(!wrap||!svg) return;
  var idx = STATE.seqIndex; var st = STATE.answers[idx];
  var wrapRect = wrap.getBoundingClientRect();
  svg.setAttribute('width', wrapRect.width); svg.setAttribute('height', wrapRect.height);
  var out = '';
  Object.keys(st.leftLinks).forEach(function(li){
    var ri = st.leftLinks[li];
    var leftEl = document.querySelector('.match-item[data-left="'+li+'"] .dot');
    var rightEl = document.querySelector('.match-item[data-right="'+ri+'"] .dot');
    if(!leftEl||!rightEl) return;
    var lr=leftEl.getBoundingClientRect(), rr=rightEl.getBoundingClientRect();
    var x1=lr.left+lr.width/2-wrapRect.left, y1=lr.top+lr.height/2-wrapRect.top;
    var x2=rr.left+rr.width/2-wrapRect.left, y2=rr.top+rr.height/2-wrapRect.top;
    var mx=(x1+x2)/2;
    out += '<path d="M'+x1+' '+y1+' C '+mx+' '+y1+', '+mx+' '+y2+', '+x2+' '+y2+'" fill="none" stroke="'+TC.gold+'" stroke-width="2.5"/>';
    out += '<circle cx="'+x1+'" cy="'+y1+'" r="4" fill="'+TC.teal8+'"/><circle cx="'+x2+'" cy="'+y2+'" r="4" fill="'+TC.teal8+'"/>';
  });
  svg.innerHTML = out;
}

/* ===================== NAVIGATOR ===================== */
function openNavigator(){
  var html = '<div class="nav-overlay" id="navOverlay"><div class="nav-sheet">'+
    '<h3>Navigasi Soal</h3>'+
    '<div class="nav-legend"><span><i class="dotlegend" style="background:var(--teal-100);border:1px solid var(--teal-700)"></i>Terjawab</span>'+
    '<span><i class="dotlegend" style="background:var(--gold-100);border:1px solid var(--gold-600)"></i>Sebagian</span>'+
    '<span><i class="dotlegend" style="background:#fff;border:1px solid var(--line)"></i>Belum</span></div>'+
    '<div class="nav-grid">';
  for(var n=1;n<=100;n++){
    var seqI = findSeqIndexForSoal(n);
    var status = getAnswerStatus(seqI);
    html += '<div class="nav-cell '+status+(seqI===STATE.seqIndex?' current':'')+'" data-seq="'+seqI+'">'+n+'</div>';
  }
  html += '</div><button class="nav-close" id="navClose">Tutup</button></div></div>';
  navOverlayRoot.innerHTML = html;
  Array.prototype.forEach.call(document.querySelectorAll('.nav-cell'), function(el){
    el.addEventListener('click', function(){
      STATE.seqIndex = parseInt(el.getAttribute('data-seq'),10);
      navOverlayRoot.innerHTML = '';
      renderQuiz();
    });
  });
  document.getElementById('navClose').addEventListener('click', function(){ navOverlayRoot.innerHTML=''; });
  document.getElementById('navOverlay').addEventListener('click', function(e){ if(e.target.id==='navOverlay') navOverlayRoot.innerHTML=''; });
}
function findSeqIndexForSoal(n){
  for(var i=0;i<STATE.ranges.length;i++){ if(n>=STATE.ranges[i][0] && n<=STATE.ranges[i][1]) return i; }
  return 0;
}
function getAnswerStatus(seqI){
  var node = STATE.sequence[seqI]; var ans = STATE.answers[seqI];
  if(node.kind==='item') return (ans!==undefined && ans!==null) ? 'answered' : '';
  if(!ans) return '';
  var n = Object.keys(ans.leftLinks).length;
  if(n===0) return '';
  if(n===node.pairs.length) return 'answered';
  return 'partial';
}

/* ===================== FINISH & RESULT ===================== */
function finishQuiz(){
  stopTimer();
  overtimeBanner.style.display = 'none';
  topActions.innerHTML = '<button class="icon-btn" id="homeBtnResult">Beranda</button>';
  topActions.querySelector('#homeBtnResult').addEventListener('click', goHome);
  STATE.screen = 'result';
  STATE.resultTab = 'all';
  renderResult();
}

function gradeAll(){
  // returns array of {seqIndex, kind, subject, cat, level, correct(bool or null), detail}
  var out = [];
  STATE.sequence.forEach(function(node, i){
    if(node.kind==='item'){
      var ans = STATE.answers[i];
      var correct;
      if(node.type==='pg') correct = (ans===node.ans);
      else correct = (ans===node.val);
      out.push({seqIndex:i, kind:'item', subject:node.subject, cat:node.cat, level:node.level,
        answered: ans!==undefined && ans!==null, correct: correct, node: node, ans: ans});
    } else {
      var st = STATE.answers[i] || {leftLinks:{}};
      node.pairs.forEach(function(p, li){
        var chosen = st.leftLinks[li];
        var correct = chosen===li;
        out.push({seqIndex:i, kind:'match', pairIndex:li, subject:node.subject, cat:'Menjodohkan', level:node.level,
          answered: chosen!==undefined, correct: correct, node: node, chosen: chosen});
      });
    }
  });
  return out;
}

function renderResult(){
  var graded = gradeAll();
  var totalCorrect = graded.filter(function(g){return g.correct;}).length;
  var scorePct = Math.round(totalCorrect/100*100);

  var bySubject = {}; var byLevel = {};
  graded.forEach(function(g){
    bySubject[g.subject] = bySubject[g.subject] || {c:0,t:0}; bySubject[g.subject].t++; if(g.correct) bySubject[g.subject].c++;
    byLevel[g.level] = byLevel[g.level] || {c:0,t:0}; byLevel[g.level].t++; if(g.correct) byLevel[g.level].c++;
  });

  var timeUsed = 90*60 - STATE.timerSeconds;
  var timeStr = fmtDuration(Math.max(timeUsed,0)) + (STATE.timerSeconds<0 ? (' (lewat '+fmtDuration(-STATE.timerSeconds)+')') : '');

  var html = '<div class="result-hero"><div class="label">HASIL '+esc(STATE.pkgName).toUpperCase()+'</div>'+
    '<div class="score">'+scorePct+'</div><div class="label">'+totalCorrect+' / 100 benar &nbsp;\u00b7&nbsp; Waktu: '+timeStr+'</div></div>';

  html += '<h3 class="serif" style="font-size:14.5px;color:var(--teal-900);margin:0 0 4px;">Rincian per mata pelajaran</h3><div class="breakdown">';
  Object.keys(bySubject).forEach(function(s){
    var d=bySubject[s]; var p=Math.round(d.c/d.t*100);
    html += '<div><div class="bd-top"><span>'+s+'</span><span>'+d.c+'/'+d.t+'</span></div><div class="bd-track"><div class="bd-fill" style="width:'+p+'%"></div></div></div>';
  });
  html += '</div>';

  html += '<h3 class="serif" style="font-size:14.5px;color:var(--teal-900);margin:14px 0 4px;">Rincian per tingkat kesulitan</h3><div class="breakdown">';
  ['HOTS','Sedang','Rendah'].forEach(function(lv){
    var d=byLevel[lv]||{c:0,t:0}; var p=d.t? Math.round(d.c/d.t*100):0;
    html += '<div><div class="bd-top"><span>'+lv+'</span><span>'+d.c+'/'+d.t+'</span></div><div class="bd-track"><div class="bd-fill" style="width:'+p+'%"></div></div></div>';
  });
  html += '</div>';

  html += '<div class="tab-row">'+
    '<button class="tab-btn'+(STATE.resultTab==='all'?' active':'')+'" data-tab="all">Semua (100)</button>'+
    '<button class="tab-btn'+(STATE.resultTab==='correct'?' active':'')+'" data-tab="correct">Benar ('+totalCorrect+')</button>'+
    '<button class="tab-btn'+(STATE.resultTab==='wrong'?' active':'')+'" data-tab="wrong">Salah ('+(100-totalCorrect)+')</button>'+
    '</div>';

  var filtered = graded.filter(function(g){
    if(STATE.resultTab==='correct') return g.correct;
    if(STATE.resultTab==='wrong') return !g.correct;
    return true;
  });

  html += '<div id="reviewList">';
  filtered.forEach(function(g, i){
    html += reviewItemHtml(g, i+1);
  });
  html += '</div>';

  html += '<div class="nav-row" style="margin-top:18px"><button class="btn btn-ghost" id="retryBtn">Ulangi Paket Ini</button><button class="btn btn-primary" id="homeBtn2">Pilih Paket Lain</button></div>';

  mainArea.innerHTML = html;
  Array.prototype.forEach.call(document.querySelectorAll('.tab-btn'), function(b){
    b.addEventListener('click', function(){ STATE.resultTab = b.getAttribute('data-tab'); renderResult(); });
  });
  document.getElementById('retryBtn').addEventListener('click', function(){ startPackage(STATE.pkgName); });
  document.getElementById('homeBtn2').addEventListener('click', goHome);
}

function reviewItemHtml(g, num){
  var cls = 'review-item ' + (g.correct?'correct':'wrong');
  var meta = '<span class="badge subject-'+g.subject+'">'+g.subject+'</span><span class="badge lvl-'+g.level+'">'+g.level+'</span>';
  var body = '';
  if(g.kind==='item'){
    var node = g.node;
    var yourTxt, correctTxt;
    if(node.type==='pg'){
      yourTxt = (g.ans!==undefined && g.ans!==null) ? node.opts[g.ans] : '(tidak dijawab)';
      correctTxt = node.opts[node.ans];
    } else {
      yourTxt = (g.ans!==undefined && g.ans!==null) ? (g.ans?'BENAR':'SALAH') : '(tidak dijawab)';
      correctTxt = node.val ? 'BENAR' : 'SALAH';
    }
    body = '<p class="rq">'+num+'. '+esc(node.q)+'</p>'+
      '<p class="ra">Jawabanmu: <b class="'+(g.correct?'ok':'no')+'">'+esc(yourTxt)+'</b>'+(g.correct?'':' &middot; Kunci: <b class="ok">'+esc(correctTxt)+'</b>')+'</p>'+
      '<div class="rhint">'+esc(node.hint)+'</div>';
  } else {
    var pair = g.node.pairs[g.pairIndex];
    var yourTxt2 = (g.chosen!==undefined) ? g.node.pairs[g.chosen][1] : '(tidak dijawab)';
    body = '<p class="rq">'+num+'. '+esc(pair[0])+'</p>'+
      '<p class="ra">Jawabanmu: <b class="'+(g.correct?'ok':'no')+'">'+esc(yourTxt2)+'</b>'+(g.correct?'':' &middot; Kunci: <b class="ok">'+esc(pair[1])+'</b>')+'</p>';
  }
  return '<div class="'+cls+'"><div class="rmeta">'+meta+'</div>'+body+'</div>';
}

function fmtDuration(s){
  var mm = Math.floor(s/60), ss = s%60;
  return mm+' menit '+ss+' detik';
}

/* ===================== INIT ===================== */
renderHome();

</script>
