<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Latihan Soal PAI-BTQ MAPSI XXVII</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --teal-950:#0c2e27; --teal-900:#123f35; --teal-800:#175c4c; --teal-700:#1f7562;
  --teal-100:#e4efe9; --teal-50:#f2f7f4;
  --gold-600:#b6862f; --gold-500:#c99a3d; --gold-100:#f3e7cd;
  --paper:#faf7f0; --surface:#ffffff; --ink:#211f1a; --ink-soft:#5c574c; --line:#e3dccb;
  --red-600:#a13d3d; --red-50:#f8eeee; --green-700:#256b45; --green-50:#eef6ef;
  --radius:10px; --shadow:0 1px 2px rgba(20,30,25,.06), 0 6px 20px rgba(20,30,25,.06);
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--paper);color:var(--ink);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
h1,h2,h3,.serif{font-family:'Lora',Georgia,serif;}
.arabic{font-family:'Amiri','Traditional Arabic',serif;direction:rtl;}
img,svg{max-width:100%;}
button{font-family:inherit;}
#app{max-width:760px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;}

/* ---- topbar ---- */
.topbar{background:linear-gradient(160deg,var(--teal-900),var(--teal-800) 70%);color:#f4efe0;padding:12px 16px;position:sticky;top:0;z-index:30;box-shadow:0 2px 10px rgba(0,0,0,.15);}
.topbar-row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.brand{display:flex;align-items:center;gap:9px;min-width:0;}
.brand-mark{width:26px;height:26px;flex:none;}
.brand h1{font-size:14px;margin:0;line-height:1.2;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.brand p{margin:0;font-size:10.5px;color:#cfe3db;white-space:nowrap;}
.top-actions{display:flex;align-items:center;gap:8px;flex:none;}
.timer-chip{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);border-radius:100px;padding:5px 11px;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.3px;}
.timer-chip.over{background:#5b2323;border-color:#7a3030;color:#ffdada;}
.icon-btn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.28);color:#f4efe0;padding:6px 10px;border-radius:100px;font-size:12px;cursor:pointer;white-space:nowrap;}
.icon-btn:hover{background:rgba(255,255,255,.2);}
.overtime-banner{background:#5b2323;color:#ffdada;font-size:11.5px;text-align:center;padding:5px;margin-top:8px;border-radius:6px;}

main{flex:1;padding:16px 16px 40px;}

/* ---- home ---- */
.intro{padding:4px 2px 16px;}
.intro h2{font-size:20px;margin:0 0 6px;color:var(--teal-900);}
.intro p{margin:0;color:var(--ink-soft);font-size:13.5px;line-height:1.55;}
.pkg-grid{display:grid;grid-template-columns:1fr;gap:11px;margin-top:14px;}
.pkg-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:15px 15px 13px;display:flex;gap:13px;align-items:center;cursor:pointer;}
.pkg-card:hover{border-color:var(--teal-700);}
.pkg-letter{width:42px;height:42px;flex:none;border-radius:50%;background:var(--teal-900);color:var(--gold-100);display:flex;align-items:center;justify-content:center;font-family:'Lora',serif;font-size:17px;font-weight:600;}
.pkg-body{flex:1;min-width:0;}
.pkg-body h3{margin:0 0 2px;font-size:14.5px;}
.pkg-body p{margin:0;font-size:11.5px;color:var(--ink-soft);}
.pkg-arrow{flex:none;color:var(--teal-700);font-size:19px;}
.spec-box{margin-top:20px;border-top:1px solid var(--line);padding-top:14px;font-size:12px;color:var(--ink-soft);line-height:1.7;}
.spec-box b{color:var(--ink);}
.spec-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;margin-top:6px;}

/* ---- progress ---- */
.progress-wrap{padding:2px 2px 12px;}
.progress-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;flex-wrap:wrap;gap:4px;}
.badges{display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
.badge{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:100px;letter-spacing:.2px;}
.badge.subject-PAI{background:var(--teal-100);color:var(--teal-800);}
.badge.subject-BTQ{background:var(--gold-100);color:var(--gold-600);}
.badge.lvl-HOTS{background:#fde3e3;color:var(--red-600);}
.badge.lvl-Sedang{background:#fff3d6;color:#8a6414;}
.badge.lvl-Rendah{background:var(--green-50);color:var(--green-700);}
.progress-top .count{font-size:11.5px;color:var(--ink-soft);}
.progress-track{height:5px;background:var(--teal-100);border-radius:100px;overflow:hidden;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--gold-600),var(--gold-500));border-radius:100px;transition:width .2s;}

/* ---- question card ---- */
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:17px 15px;box-shadow:var(--shadow);}
.qcat{font-size:11px;color:var(--teal-700);font-weight:700;margin-bottom:4px;}
.qtext{font-size:15.5px;line-height:1.5;color:var(--ink);margin:0 0 12px;}
.ayat-box{background:var(--teal-50);border:1px solid var(--teal-100);border-left:3px solid var(--teal-700);border-radius:6px;padding:15px 13px;margin:0 0 13px;}
.ayat-box .arabic{font-size:23px;line-height:2;color:var(--teal-900);}
.q-img{margin:0 0 13px;border:1px solid var(--line);border-radius:6px;padding:9px;background:#fff;}
.q-img figcaption{font-size:11px;color:var(--ink-soft);margin-top:5px;text-align:center;}

.opts{display:flex;flex-direction:column;gap:8px;margin-top:2px;}
.opt{display:flex;align-items:center;gap:10px;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;font-size:14px;color:var(--ink);}
.opt .tag{flex:none;width:23px;height:23px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;color:var(--ink-soft);}
.opt:hover{border-color:var(--teal-700);}
.opt.selected{border-color:var(--teal-800);background:var(--teal-50);}
.opt.selected .tag{background:var(--teal-800);border-color:var(--teal-800);color:#fff;}
.bs-opts{display:flex;gap:10px;margin-top:2px;}
.bs-opt{flex:1;text-align:center;padding:14px 10px;border-radius:8px;border:1.5px solid var(--line);cursor:pointer;font-weight:700;font-size:14px;}
.bs-opt.true{color:var(--green-700);}
.bs-opt.false{color:var(--red-600);}
.bs-opt.selected.true{background:var(--green-50);border-color:var(--green-700);}
.bs-opt.selected.false{background:var(--red-50);border-color:var(--red-600);}

.hint-toggle{margin-top:13px;background:none;border:1.5px dashed var(--gold-600);color:var(--gold-600);border-radius:8px;padding:9px 12px;font-size:12.5px;font-weight:700;cursor:pointer;width:100%;}
.hint-toggle:hover{background:var(--gold-100);}
.hint-box{margin-top:10px;background:var(--gold-100);border-radius:8px;padding:12px 13px;font-size:12.5px;line-height:1.55;color:#5c4816;}
.hint-box .hk{font-weight:700;color:var(--gold-600);display:block;margin-bottom:3px;}

.nav-row{display:flex;gap:9px;margin-top:15px;}
.btn{border:none;border-radius:100px;padding:12px 16px;font-size:13.5px;font-weight:700;cursor:pointer;}
.btn-primary{background:var(--teal-800);color:#fbf7ee;flex:1;}
.btn-primary:disabled{background:#c7c2b3;cursor:not-allowed;}
.btn-ghost{background:transparent;color:var(--teal-800);border:1.5px solid var(--teal-800);}
.btn-gold{background:var(--gold-600);color:#fff;}

/* ---- matching ---- */
.match-instructions{font-size:13px;color:var(--ink-soft);margin:0 0 13px;line-height:1.55;}
.match-wrap{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 7px;box-shadow:var(--shadow);}
.match-cols{display:flex;justify-content:space-between;gap:8px;position:relative;z-index:2;}
.match-col{display:flex;flex-direction:column;gap:12px;width:47%;}
.match-item{display:flex;align-items:center;gap:7px;background:var(--teal-50);border:1.5px solid var(--line);border-radius:8px;padding:9px 9px;font-size:12.5px;cursor:pointer;min-height:40px;}
.match-col.right .match-item{background:var(--gold-100);}
.match-item .dot{flex:none;width:10px;height:10px;border-radius:50%;border:2px solid var(--ink-soft);background:#fff;}
.match-item.active{border-color:var(--teal-800);}
.match-item.linked{border-color:var(--teal-700);}
.match-item.linked .dot{background:var(--teal-700);border-color:var(--teal-700);}
#lineSvg{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none;}
.match-toolbar{display:flex;gap:9px;margin-top:13px;}

/* ---- navigator modal ---- */
.nav-overlay{position:fixed;inset:0;background:rgba(15,25,20,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center;}
.nav-sheet{background:var(--surface);width:100%;max-width:760px;border-radius:16px 16px 0 0;padding:16px 16px 20px;max-height:78vh;overflow-y:auto;}
.nav-sheet h3{margin:0 0 10px;font-size:15px;color:var(--teal-900);}
.nav-legend{display:flex;gap:14px;font-size:11px;color:var(--ink-soft);margin-bottom:12px;flex-wrap:wrap;}
.nav-legend span{display:inline-flex;align-items:center;gap:5px;}
.dotlegend{width:9px;height:9px;border-radius:50%;display:inline-block;}
.nav-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;}
.nav-cell{aspect-ratio:1;border-radius:6px;border:1.5px solid var(--line);background:#fff;font-size:10.5px;font-weight:700;color:var(--ink-soft);cursor:pointer;display:flex;align-items:center;justify-content:center;}
.nav-cell.answered{background:var(--teal-100);border-color:var(--teal-700);color:var(--teal-800);}
.nav-cell.partial{background:var(--gold-100);border-color:var(--gold-600);color:var(--gold-600);}
.nav-cell.current{outline:2px solid var(--teal-800);outline-offset:1px;}
.nav-close{display:block;margin:14px auto 0;background:var(--teal-800);color:#fff;border:none;border-radius:100px;padding:10px 22px;font-size:13px;font-weight:700;}

/* ---- result / review ---- */
.result-hero{background:linear-gradient(160deg,var(--teal-900),var(--teal-800));color:#f4efe0;border-radius:var(--radius);padding:24px 18px;text-align:center;margin-bottom:16px;}
.result-hero .score{font-family:'Lora',serif;font-size:40px;font-weight:700;margin:2px 0;}
.result-hero .label{font-size:12px;color:#cfe3db;}
.breakdown{display:flex;flex-direction:column;gap:9px;margin:14px 0 18px;}
.bd-top{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px;color:var(--ink-soft);}
.bd-track{height:7px;background:var(--teal-100);border-radius:100px;overflow:hidden;}
.bd-fill{height:100%;background:var(--teal-700);border-radius:100px;}
.tab-row{display:flex;gap:8px;margin:16px 0 12px;}
.tab-btn{flex:1;padding:9px;border-radius:100px;border:1.5px solid var(--line);background:#fff;font-size:12.5px;font-weight:700;color:var(--ink-soft);cursor:pointer;}
.tab-btn.active{background:var(--teal-800);border-color:var(--teal-800);color:#fff;}
.review-item{border:1px solid var(--line);border-radius:8px;padding:12px 13px;font-size:13px;margin-bottom:9px;}
.review-item.correct{border-left:4px solid var(--green-700);}
.review-item.wrong{border-left:4px solid var(--red-600);}
.review-item .rmeta{display:flex;gap:6px;margin-bottom:6px;flex-wrap:wrap;}
.review-item .rq{color:var(--ink);margin:0 0 6px;font-weight:600;line-height:1.45;}
.review-item .ra{color:var(--ink-soft);line-height:1.5;}
.review-item .ra b.ok{color:var(--green-700);}
.review-item .ra b.no{color:var(--red-600);}
.review-item .rhint{margin-top:6px;font-size:12px;color:#5c4816;background:var(--gold-100);border-radius:6px;padding:8px 9px;}

.footer-note{text-align:center;color:var(--ink-soft);font-size:11px;padding:16px 0 4px;}
</style>
</head>

an umat Islam untuk saling menghormati perbedaan suku, budaya, dan pendapat selama tidak bertentangan dengan akidah.", "val": true, "hint": "Benar. Islam mengajarkan umatnya untuk menghargai keberagaman sebagai sunnatullah dan sarana untuk saling mengenal serta bekerja sama dalam kebaikan.", "ar": null, "img": null}, {"type": "pg", "subject": "PAI", "cat": "Aqidah", "level": "Rendah", "q": "Asmaul husna \"Al-'Alim\" memiliki arti Allah Maha ...", "opts": ["Mengetahui", "Mendengar", "Melihat", "Menciptakan"], "ans": 0, "hint": "Al-'Alim berarti Allah Maha Mengetahui segala sesuatu, baik yang tampak maupun tersembunyi.", "ar": null, "img": null}, {"type": "pg", "subject": "PAI", "cat": "Aqidah", "level": "Sedang", "q": "Asmaul husna \"As-Sami'\" mengajarkan kita untuk yakin bahwa ...", "opts": ["Allah Maha Mendengar setiap doa dan perkataan makhluk-Nya", "Allah hanya mendengar orang yang berdoa keras", "Allah tidak mendengar bisikan hati", "Allah hanya mendengar di masjid"], "ans": 0, "hint": "As-Sami' berarti Allah Maha Mendengar, sehingga doa sekecil apa pun dan dalam kondisi apa pun pasti didengar oleh-Nya.", "ar": null, "img": null}, {"type": "pg", "subject": "PAI", "cat": "Aqidah", "level": "HOTS", "q": "Seorang anak berbuat curang saat ujian karena mengira tidak ada yang melihat. Asmaul husna yang paling tepat mengingatkannya bahwa perbuatannya tetap diketahui Allah adalah ...", "opts": ["Al-Wahhab dan Al-Malik", "Al-'Alim dan As-Sami'", "Al-'Aziz dan Al-Afuww", "Al-Hayyu dan Al-Qayyum"], "ans": 1, "hint": "Al-'Alim (Maha Mengetahui) dan As-Sami' (Maha Mendengar) mengingatkan bahwa Allah selalu mengetahui dan mendengar segala perbuatan, sekecil apa pun dan di mana pun.", "ar": null, "img": null}, {"type": "pg", "subject": "PAI", "cat": "Aqidah", "level": "HOTS", "q": "Pasangan asmaul husna yang tepat menunjukkan bahwa Allah berkuasa penuh atas hidup dan mati makhluk-Nya adalah ...", "opts": ["Al-Hayyu dan Al-Mumit", "Al-Malik dan Al-Wahhab", "Al-'Azīz dan Al-Afuww", "Al-Qayyum dan As-Sami'"], "ans": 0, "hint": "Al-Hayyu (Maha Hidup) dan Al-Mumit (Maha Mematikan) menegaskan kekuasaan Allah penuh atas kehidupan dan kematian seluruh makhluk.", "ar": null, "img": null}, {"type": "bs", "subject": "PAI", "cat": "Aqidah", "level": "Rendah", "q": "Asmaul husna \"Al-Qayyum\" berarti Allah Maha Berdiri Sendiri dan mengurus seluruh makhluk-Nya tanpa bantuan siapa pun.", "val": true, "hint": "Benar. Al-Qayyum menunjukkan bahwa Allah tidak bergantung pada siapa pun, sedangkan seluruh makhluk bergantung kepada-Nya.", "ar": null, "img": null}, {"type": "pg", "subject": "PAI", "cat": "Aqidah", "level": "HOTS", "q": "Seorang siswa merasa iri karena nilai temannya lebih tinggi walaupun sudah belajar keras. Asmaul husna yang paling tepat menenangkan hatinya untuk menerima ketetapan Allah adalah ...", "opts": ["Al-Ahad", "Al-Malik dan Al-Qayyum", "Al-Wahhab dan Al-'Azīz", "Al-Mumit"], "ans": 2, "hint": "Al-Wahhab (Maha Pemberi karunia) mengajarkan bahwa rezeki dan hasil usaha adalah pemberian Allah, sedangkan Al-'Azīz (Maha Perkasa/Mulia) mengajarkan untuk tetap semangat dan tidak rendah diri.", "ar": null, "img": null}, {"type": "pg", "subject": "PAI", "cat": "Aqidah", "level": "Rendah", "q": "Rukun iman yang keempat adalah beriman kepada ...", "opts": ["Malaikat-malaikat Allah", "Kitab-kitab Allah", "Rasul-rasul Allah", "Hari akhir"], "ans": 2, "hint": "Urutan rukun iman: 1) Allah, 2) Malaikat, 3) Kitab, 4) Rasul, 5) Hari akhir, 6) Qada dan qadar.", "ar": null, "img": null}, {"type": "bs", "subject": "PAI", "cat": "Aqidah", "level": "HOTS", "q": "Beriman kepada qada dan qadar berarti meyakini segala ketentuan Allah, namun manusia tetap wajib berikhtiar semaksimal mungkin sebelum bertawakal.", "val": true, "hint": "Benar. Iman kepada qada dan qadar tidak menghilangkan kewajiban berusaha (ikhtiar); setelah berusaha maksimal barulah bertawakal menyerahkan hasil kepada Allah.", "ar": null, "img": null}, {"type": "pg", "subject": "PAI", "cat": "Aqidah", "level": "HOTS", "q": "Seorang anak sudah belajar sungguh-sungguh namun tetap gagal dalam lomba. Sikap yang mencerminkan pemahaman iman kepada qada dan qadar yang benar adalah ...", "opts": ["Berhenti berusaha karena semua sudah ditentukan", "Menerima hasil dengan lapang dada sambil tetap berikhtiar memperbaiki diri", "Menyalahkan takdir dan marah kepada Allah", "Berhenti percaya kepada Allah"], "ans": 1, "hint": "Iman kepada qada dan qadar mengajarkan untuk menerima hasil dengan ikhlas (rida) sambil terus berikhtiar dan memperbaiki diri, bukan menyerah atau menyalahkan Allah.", "ar": null, "img": null}, {"type": "bs", "subject": "PAI", "cat": "Akhlak", "level": "Rendah", "q": "Setelah selesai makan, dianjurkan membaca hamdalah sebagai ucapan syukur kepada Allah.", "val": true, "hint": "Benar. Hamdalah (alhamdulillah) dibaca setelah selesai suatu kegiatan sebagai wujud rasa syukur kepada Allah.", "ar": null, "img": null}, {"type": "pg", "subject": "PAI", "cat": "Akhlak", "level": "HOTS", "q": "Rina melihat temannya menangis karena mainannya rusak. Rina ikut merasa sedih dan berusaha menghiburnya. Sikap Rina ini mencerminkan akhlak ...", "opts": ["Munafik", "Empati", "Disiplin", "Sombong"], "ans": 1, "hint": "Empati adalah kemampuan merasakan dan memahami perasaan orang lain, seperti yang ditunjukkan Rina dengan ikut sedih dan berusaha membantu.", "ar": null, "img": null}, {"type": "pg", "subject": "PAI", "cat": "Akhlak", "level": "Sedang", "q": "Berkata dan berbuat sesuai kenyataan disebut sikap ...", "opts": ["Jujur", "Amanah", "Sombong", "Riya"], "ans": 0, "hint": "Jujur adalah sikap berkata dan bertindak sesuai dengan kenyataan yang sebenarnya, tanpa berbohong.", "ar": null, "img": null}, {"type": "pg", "subject": "PAI", "cat": "Akhlak", "level": "HOTS", "q": "Andi menemukan dompet berisi uang di jalan. Ia tahu tidak ada yang melihatnya. Tindakan yang mencerminkan sikap jujur adalah ...", "opts": ["Mengambil uangnya lalu membuang dompetnya", "Mengembalikan dompet secara utuh kepada pemiliknya atau menyerahkannya ke pihak berwenang", "Menyimpan dompet tanpa memberi tahu siapa pun", "Membiarkannya begitu saja di jalan"], "ans": 1, "hint": "Sikap jujur ditunjukkan dengan mengembalikan barang temuan kepada pemiliknya, meskipun tidak ada yang melihat, karena Allah selalu mengawasi.", "ar": null, "img": null}, {"type": "pg", "subject": "PAI", "cat": "Akhlak", "level": "Rendah", "q": "Berbakti dan patuh kepada orang tua serta guru selama tidak bermaksiat termasuk akhlak ...", "opts": ["Terpuji", "Tercela", "Makruh", "Tidak wajib"], "ans": 0, "hint": "Berbakti kepada orang tua dan menghormati guru merupakan akhlak terpuji yang sangat ditekankan dalam ajaran Islam.", "ar": null, "img": null}, {"type": "pg", "subject": "PAI", "cat": "Akhlak", "level": "HOTS", "q": "Menghormati orang lain, termasuk yang lebih tua maupun lebih muda, adalah wujud akhlak ...", "opts": ["Terpuji dalam pergaulan", "Tercela dan berlebihan", "Hanya berlaku untuk orang kaya", "Tidak diajarkan dalam Islam"], "ans": 0, "hint": "Islam mengajarkan untuk menghormati sesama manusia tanpa memandang usia, status, atau latar belakang.", "ar": null, "img": null}, {"type": "pg", "subject": "PAI", "cat": "Akhlak", "level": "HOTS", "q": "Di kelas terdapat siswa dari berbagai suku dan budaya. Sikap yang mencerminkan sikap menghargai dalam keragaman adalah ...", "opts": ["Hanya berteman dengan yang satu suku", "Menghormati perbedaan dan tetap bekerja sama dalam kebaikan", "Mengejek kebiasaan suku lain", "Memaksakan kebiasaan sendiri kepada teman lain"], "ans": 1, "hint": "Menghargai keragaman berarti menerima perbedaan suku dan budaya sebagai kekayaan bersama, serta tetap menjalin kerja sama yang baik.", "ar": null, "img": null}, {"type": "bs", "subject": "PAI", "cat": "Akhlak", "level": "HOTS", "q": "Memberi dan meminta maaf merupakan akhlak terpuji yang dapat mempererat hubungan persaudaraan sesama muslim.", "val": true, "hint": "Benar. Saling memaafkan dan meminta maaf dapat menghilangkan kesalahpahaman serta mempererat ukhuwah.", "ar": null, "img": null}, {"type": "pg", "subject": "PAI", "cat": "Akhlak", "level": "HOTS", "q": "Datang tepat waktu ke sekolah dan mengerjakan tugas sesuai jadwal mencerminkan sikap ...", "opts": ["Disiplin", "Malas", "Sombong", "Munafik"], "ans": 0, "hint": "Disiplin adalah sikap taat pada aturan dan tepat waktu dalam menjalankan tanggung jawab.", "ar": null, "img": null}, {"type": "pg", "subject": "PAI", "cat": "Akhlak", "level": "HOTS", "q": "Sekolah mengadakan program Jumat Bersih setiap minggu. Manfaat utama dari kebiasaan gaya hidup bersih ini bagi warga sekolah adalah ...", "opts": ["Membuang waktu belajar", "Menjaga kesehatan dan kenyamanan bersama, sesuai ajaran kebersihan sebagian dari iman", "Hanya kewajiban petugas kebersihan", "Tidak ada manfaatnya"], "ans": 1, "hint": "Kebersihan merupakan sebagian dari iman; menjaga lingkungan bersih memberi manfaat kesehatan dan kenyamanan bagi semua warga sekolah.", "ar": null, "img": null}, {"type": "bs", "subject": "PAI", "cat": "Akhlak", "level": "HOTS", "q": "Seorang siswa selalu menunjukkan sikap rajin beribadah di depan guru, namun sering berbohong dan mengingkari janji kepada teman-temannya. Sikap ini termasuk ciri munafik.", "val": true, "hint": "Benar. Salah satu ciri munafik menurut hadis adalah apabila berbicara ia berdusta, berjanji ia mengingkari, dan diberi amanah ia berkhianat, meski tampil taat di hadapan orang lain.", "ar": null, "img": null}, {"type": "pg", "subject": "PAI", "cat": "Akhlak", "level": "HOTS", "q": "Fina berteman baik dengan Made yang berbeda agama. Mereka saling membantu dalam belajar tanpa mempermasalahkan perbedaan keyakinan. Sikap Fina mencerminkan akhlak ...", "opts": ["Munafik", "Berteman tanpa membedakan agama", "Fanatik berlebihan", "Riya"], "ans": 1, "hint": "Islam mengajarkan untuk tetap bergaul baik dan saling membantu dalam hal duniawi/sosial dengan siapa pun tanpa membedakan agama, selama tidak mencampuri akidah.", "ar": null, "img": null}, {"type": "pg", "subject": "PAI", "cat": "Akhlak", "level": "HOTS", "q": "Membuang sampah pada tempatnya dan tidak menebang pohon sembarangan merupakan wujud sikap ...", "opts": ["Peduli lingkungan", "Sombong", "Boros", "Malas"], "ans": 0, "hint": "Peduli lingkungan adalah akhlak terpuji yang mencerminkan tanggung jawab manusia sebagai khalifah di bumi untuk menjaga alam.", "ar": null, "img": null}, {"type": "bs", "subject": "PAI", "cat": "Fiqih", "level": "Rendah", "q": "Iqamah dikumandangkan sesaat sebelum shalat fardu dimulai, setelah azan.", "val": true, "hint": "Benar. Iqamah dikumandangkan tepat sebelum shalat dimulai, sebagai tanda shalat berjamaah akan segera dilaksanakan.", "ar": null, "img": null}, {"type": "pg", "subject": "PAI", "cat": "Fiqih", "level": "Sedang", "q": "Jumlah rakaat shalat fardu dalam sehari semalam adalah ...", "opts": ["15 rakaat", "17 rakaat", "19 rakaat", "21 rakaat"], "ans": 1, "hint": "Total rakaat shalat fardu: Subuh(2)+Zuhur(4)+Ashar(4)+Maghrib(3)+Isya(4)=17 rakaat.", "ar": null, "img": null}, {"type": "pg", "subject": "PAI", "cat": "Fiqih", "level": "HOTS", "q": "Seorang anak baru mengalami mimpi basah untuk pertama kalinya. Menurut fiqih, hal ini menandakan bahwa ia telah ...", "opts": ["Wajib puasa seumur hidup", "Mencapai usia balig sehingga terkena kewajiban syariat (mukalaf)", "Boleh meninggalkan shalat", "Belum wajib menjalankan ibadah"], "ans": 1, "hint": "Mimpi basah adalah salah satu tanda balig bagi laki-laki. Seseorang yang telah balig disebut mukalaf, yaitu wajib menjalankan seluruh kewajiban syariat.", "ar": null, "img": null}, {"type": "pg", "subject": "PAI", "cat": "Fiqih", "level": "Sedang", "q": "Berikut ini yang termasuk tanda balig bagi perempuan adalah ...", "opts": ["Mimpi basah", "Haid", "Tumbuh kumis", "Suara berubah"], "ans": 1, "hint": "Haid adalah salah satu tanda balig bagi perempuan yang menandakan ia telah mukalaf dan wajib menjalankan syariat.", "ar": null, "img": null}, {"type": "pg", "subject": "PAI", "cat": "Fiqih", "level": "HOTS", "q": "Pak Budi memiliki tabungan yang telah mencapai nisab selama satu tahun penuh (haul). Kewajiban yang harus ditunaikan Pak Budi adalah ...", "opts": ["Sedekah sukarela", "Zakat mal", "Infak tahunan", "Wakaf"], "ans": 1, "hint": "Harta yang telah mencapai nisab dan dimiliki selama satu tahun (haul) wajib dikeluarkan zakatnya, disebut zakat mal.", "ar": null, "img": null}, {"type": "pg", "subject": "PAI", "cat": "Fiqih", "level": "Sedang", "q": "Perbedaan utama zakat dan sedekah adalah ...", "opts": ["Zakat wajib dengan ketentuan tertentu, sedekah bersifat sukarela", "Zakat hanya untuk fakir miskin, sedekah tidak boleh untuk mereka", "Sedekah wajib, zakat sukarela", "Keduanya sama persis"], "ans": 0, "hint": "Zakat adalah kewajiban dengan syarat dan ketentuan tertentu (nisab, haul), sedangkan sedekah bersifat sukarela tanpa batasan jumlah atau waktu.", "ar": null, "img": null}, {"type": "bs", "subject": "PAI", "cat": "Fiqih", "level": "HOTS", "q": "Memakan daging babi termasuk perbuatan haram menurut syariat Islam, sedangkan makanan yang baik dan bergizi termasuk halal untuk dikonsumsi.", "val": true, "hint": "Benar. Islam mengatur makanan halal dan haram; daging babi termasuk yang diharamkan secara tegas dalam Al-Qur'an.", "ar": null, "img": null}, {"type": "pg", "subject": "PAI", "cat": "Fiqih", "level": "HOTS", "q": "Seorang siswa ditawari makanan oleh temannya, namun ia tidak yakin apakah makanan tersebut mengandung bahan yang haram. Sikap yang paling tepat adalah ...", "opts": ["Langsung memakannya karena diberi teman", "Bertanya kejelasan bahan/kehalalannya sebelum memakannya", "Menolak berteman dengannya", "Memakannya diam-diam"], "ans": 1, "hint": "Sikap kehati-hatian (wara') mengajarkan untuk memastikan kehalalan sesuatu terlebih dahulu sebelum mengonsumsinya, demi menjaga diri dari yang haram atau syubhat.", "ar": null, "img": null}, {"type": "pg", "subject": "PAI", "cat": "Fiqih", "level": "Sedang", "q": "Tayamum dilakukan sebagai pengganti wudu atau mandi wajib ketika ...", "opts": ["Sedang bepergian jauh saja", "Tidak ada air atau berhalangan menggunakan air", "Sedang berpuasa", "Hendak membaca Al-Qur'an"], "ans": 1, "hint": "Tayamum menggunakan debu suci sebagai pengganti wudu/mandi wajib ketika tidak ditemukan air atau ada halangan syar'i menggunakan air.", "ar": null, "img": null}, {"type": "bs", "subject": "PAI", "cat": "Fiqih", "level": "Rendah", "q": "Membaca doa setelah shalat termasuk sunnah yang dianjurkan sebagai penutup ibadah shalat.", "val": true, "hint": "Benar. Membaca doa setelah shalat merupakan sunnah untuk memohon kebaikan kepada Allah setelah menunaikan ibadah.", "ar": null, "img": null}, {"type": "pg", "subject": "PAI", "cat": "Fiqih", "level": "Sedang", "q": "Shalat sunnah yang mengiringi shalat fardu disebut shalat ...", "opts": ["Rawatib", "Tarawih", "Istikharah", "Witir"], "ans": 0, "hint": "Shalat rawatib adalah shalat sunnah yang dikerjakan sebelum atau sesudah shalat fardu.", "ar": null, "img": null}, {"type": "pg", "subject": "PAI", "cat": "Fiqih", "level": "Rendah", "q": "Shalat Jumat hukumnya wajib bagi ...", "opts": ["Semua anak-anak", "Laki-laki muslim yang sudah balig", "Perempuan saja", "Musafir yang bepergian jauh"], "ans": 1, "hint": "Shalat Jumat wajib bagi laki-laki muslim yang sudah balig, berakal, dan bermukim (tidak sedang safar).", "ar": null, "img": null}, {"type": "pg", "subject": "PAI", "cat": "Fiqih", "level": "HOTS", "q": "Seorang anak ingin membiasakan diri bangun lebih awal untuk mendekatkan diri kepada Allah sebelum beraktivitas di siang hari. Dua shalat sunnah yang paling tepat dianjurkan untuknya adalah ...", "opts": ["Shalat Jumat dan shalat rawatib", "Shalat Duha dan Tahajud", "Shalat Istikharah dan witir", "Shalat gerhana dan istisqa"], "ans": 1, "hint": "Shalat Tahajud dikerjakan pada sepertiga malam dan shalat Duha di pagi hari; keduanya melatih kedekatan dengan Allah di luar shalat fardu.", "ar": null, "img": null}, {"type": "pg", "subject": "PAI", "cat": "Fiqih", "level": "HOTS", "q": "Menahan diri dari makan, minum, dan hal yang membatalkan sejak fajar hingga magrib disebut ...", "opts": ["Puasa", "Iktikaf", "Zikir", "Tahajud"], "ans": 0, "hint": "Puasa adalah ibadah menahan diri dari makan, minum, dan segala yang membatalkannya mulai terbit fajar hingga terbenam matahari.", "ar": null, "img": null}, {"type": "pg", "subject": "PAI", "cat": "Sejarah Peradaban Islam", "level": "HOTS", "q": "Setelah menyadari kesalahannya, Nabi Adam a.s. segera bertobat dan memohon ampun kepada Allah. Keteladanan yang dapat dipetik dari kisah ini untuk diterapkan siswa saat berbuat salah adalah ...", "opts": ["Menyalahkan orang lain atas kesalahannya", "Segera menyadari kesalahan, meminta maaf, dan bertobat", "Menyembunyikan kesalahan agar tidak ketahuan", "Berhenti berusaha memperbaiki diri"], "ans": 1, "hint": "Keteladanan Nabi Adam a.s. adalah segera menyadari kesalahan dan bersegera bertobat memohon ampun, bukan menyalahkan pihak lain.", "ar": null, "img": null}, {"type": "pg", "subject": "PAI", "cat": "Sejarah Peradaban Islam", "level": "Sedang", "q": "Nabi Ibrahim a.s. dan Nabi Ismail a.s. bersama-sama membangun ...", "opts": ["Masjid Nabawi", "Ka'bah", "Masjid Al-Aqsa", "Menara Babel"], "ans": 1, "hint": "Nabi Ibrahim a.s. bersama putranya, Nabi Ismail a.s., membangun kembali Ka'bah atas perintah Allah.", "ar": null, "img": null}, {"type": "pg", "subject": "PAI", "cat": "Sejarah Peradaban Islam", "level": "HOTS", "q": "Nabi Ismail a.s. dengan ikhlas bersedia disembelih ayahnya, Nabi Ibrahim a.s., sebagai bentuk ketaatan kepada perintah Allah. Nilai keteladanan utama yang dapat diambil dari kisah ini adalah ...", "opts": ["Keberanian melawan orang tua", "Ketaatan dan kepasrahan penuh kepada perintah Allah meski berat", "Sikap keras kepala", "Mengutamakan keinginan pribadi"], "ans": 1, "hint": "Kisah ini mengajarkan ketaatan total kepada perintah Allah meski terasa sangat berat, serta menjadi dasar disyariatkannya ibadah kurban.", "ar": null, "img": null}, {"type": "bs", "subject": "PAI", "cat": "Sejarah Peradaban Islam", "level": "HOTS", "q": "Setiap nabi dan rasul diberi mukjizat oleh Allah sebagai bukti kebenaran kerasulan mereka, misalnya Nabi Musa a.s. dengan tongkatnya dan Nabi Isa a.s. dengan izin menyembuhkan penyakit.", "val": true, "hint": "Benar. Mukjizat adalah kejadian luar biasa yang diberikan Allah kepada para rasul sebagai bukti kebenaran risalah mereka.", "ar": null, "img": null}, {"type": "pg", "subject": "PAI", "cat": "Sejarah Peradaban Islam", "level": "HOTS", "q": "Nabi Musa a.s. diberi mukjizat tongkat yang dapat berubah menjadi ular untuk menghadapi ...", "opts": ["Kaum Nabi Nuh", "Tukang sihir Fir'aun", "Kaum 'Ad", "Kaum Tsamud"], "ans": 1, "hint": "Mukjizat tongkat Nabi Musa a.s. digunakan untuk mengalahkan para tukang sihir istana Fir'aun yang menantangnya.", "ar": null, "img": null}, {"type": "pg", "subject": "PAI", "cat": "Sejarah Peradaban Islam", "level": "Sedang", "q": "Sebelum Islam datang, bangsa Arab hidup dalam masa yang disebut ...", "opts": ["Zaman keemasan", "Zaman jahiliah", "Zaman kenabian", "Zaman kekhalifahan"], "ans": 1, "hint": "Zaman jahiliah adalah masa sebelum Islam ketika bangsa Arab hidup dalam kebodohan, menyembah berhala, dan sering berperang antarsuku.", "ar": null, "img": null}, {"type": "pg", "subject": "PAI", "cat": "Sejarah Peradaban Islam", "level": "HOTS", "q": "Sejak kecil, Nabi Muhammad ﷺ dikenal sebagai anak yang jujur dan dapat dipercaya sehingga diberi gelar Al-Amin oleh masyarakat Makkah. Pelajaran yang dapat diterapkan siswa dari sifat ini adalah ...", "opts": ["Kejujuran akan membuat orang lain menjauh", "Menjaga kejujuran sejak kecil akan menumbuhkan kepercayaan orang lain", "Kejujuran hanya penting saat dewasa", "Kepercayaan bisa didapat tanpa kejujuran"], "ans": 1, "hint": "Sifat Al-Amin (dapat dipercaya) yang dimiliki Nabi ﷺ sejak kecil mengajarkan bahwa kejujuran yang konsisten akan menumbuhkan kepercayaan orang lain.", "ar": null, "img": null}, {"type": "pg", "subject": "PAI", "cat": "Sejarah Peradaban Islam", "level": "Sedang", "q": "Nabi Muhammad ﷺ diangkat menjadi rasul dan menerima wahyu pertama pada usia ...", "opts": ["25 tahun", "30 tahun", "40 tahun", "50 tahun"], "ans": 2, "hint": "Nabi Muhammad ﷺ menerima wahyu pertama di Gua Hira pada usia 40 tahun, menandai diangkatnya beliau sebagai rasul.", "ar": null, "img": null}, {"type": "pg", "subject": "PAI", "cat": "Sejarah Peradaban Islam", "level": "HOTS", "q": "Dakwah Nabi Muhammad ﷺ di Makkah pada awalnya dilakukan secara sembunyi-sembunyi sebelum akhirnya terang-terangan. Alasan yang paling tepat mengapa strategi ini digunakan adalah ...", "opts": ["Nabi takut berdakwah", "Untuk menjaga keselamatan pengikut dan mempersiapkan pondasi keimanan yang kuat", "Karena tidak ada yang mau menerima Islam", "Ajaran Islam belum lengkap"], "ans": 1, "hint": "Dakwah sembunyi-sembunyi pada masa awal bertujuan melindungi keselamatan para pengikut yang masih sedikit sekaligus mempersiapkan pondasi akidah yang kuat sebelum dakwah terbuka menghadapi tantangan yang lebih besar.", "ar": null, "img": null}, {"type": "bs", "subject": "PAI", "cat": "Sejarah Peradaban Islam", "level": "HOTS", "q": "Peristiwa hijrah Nabi Muhammad ﷺ dari Makkah ke Madinah terjadi karena tekanan dan ancaman dari kaum kafir Quraisy yang semakin berat.", "val": true, "hint": "Benar. Hijrah dilakukan untuk menyelamatkan diri dan para pengikutnya dari tekanan kaum Quraisy sekaligus mencari tempat dakwah yang lebih kondusif.", "ar": null, "img": null}, {"type": "pg", "subject": "PAI", "cat": "Sejarah Peradaban Islam", "level": "Rendah", "q": "Setibanya di Madinah, hal pertama yang dilakukan Nabi Muhammad ﷺ untuk membangun kota tersebut adalah ...", "opts": ["Membangun istana", "Membangun masjid dan mempersaudarakan Muhajirin-Anshar", "Membentuk pasukan perang", "Membuat pasar besar"], "ans": 1, "hint": "Nabi ﷺ membangun Masjid Nabawi sebagai pusat kegiatan umat dan mempersaudarakan kaum Muhajirin dengan kaum Anshar.", "ar": null, "img": null}, {"type": "pg", "subject": "PAI", "cat": "Sejarah Peradaban Islam", "level": "HOTS", "q": "Fathu Makkah (penaklukan kota Makkah) dilakukan Nabi Muhammad ﷺ hampir tanpa peperangan dan beliau memaafkan penduduk Makkah yang dahulu memusuhinya. Sikap ini mengajarkan nilai penting, yaitu ...", "opts": ["Balas dendam adalah hal wajar", "Kemenangan sejati juga ditunjukkan dengan sikap pemaaf dan lapang dada", "Kekuasaan harus digunakan untuk menindas lawan", "Kemenangan harus dirayakan dengan kekerasan"], "ans": 1, "hint": "Sikap pemaaf Nabi ﷺ saat Fathu Makkah menunjukkan bahwa kemenangan sejati disertai akhlak mulia berupa memaafkan, bukan balas dendam.", "ar": null, "img": null}, {"type": "pg", "subject": "PAI", "cat": "Sejarah Peradaban Islam", "level": "Sedang", "q": "Peristiwa Haji Wada' merupakan ...", "opts": ["Haji pertama umat Islam", "Haji perpisahan Nabi Muhammad ﷺ sekaligus berisi khutbah terakhir beliau", "Perang terakhir umat Islam", "Hijrah terakhir Nabi"], "ans": 1, "hint": "Haji Wada' adalah ibadah haji perpisahan Nabi Muhammad ﷺ yang di dalamnya beliau menyampaikan khutbah terakhir berisi pesan persaudaraan dan kesetaraan.", "ar": null, "img": null}, {"type": "pg", "subject": "PAI", "cat": "Sejarah Peradaban Islam", "level": "Rendah", "q": "Khalifah pertama setelah Nabi Muhammad ﷺ wafat adalah ...", "opts": ["Umar bin Khattab", "Abu Bakar Ash-Shiddiq", "Utsman bin Affan", "Ali bin Abi Thalib"], "ans": 1, "hint": "Abu Bakar Ash-Shiddiq adalah khalifah pertama yang dipilih oleh umat Islam setelah Rasulullah ﷺ wafat.", "ar": null, "img": null}, {"type": "pg", "subject": "PAI", "cat": "Sejarah Peradaban Islam", "level": "HOTS", "q": "Salah satu jasa besar Khalifah Utsman bin Affan adalah membukukan Al-Qur'an menjadi satu mushaf yang seragam. Manfaat penting dari kebijakan ini bagi umat Islam hingga saat ini adalah ...", "opts": ["Membuat Al-Qur'an menjadi lebih pendek", "Menjaga keaslian dan keseragaman bacaan Al-Qur'an di seluruh dunia", "Mempersulit umat Islam membaca Al-Qur'an", "Menghapus sebagian ayat Al-Qur'an"], "ans": 1, "hint": "Pembukuan mushaf oleh Utsman bin Affan menjaga keaslian teks Al-Qur'an dan mencegah perbedaan bacaan di berbagai wilayah, sehingga umat Islam di seluruh dunia membaca mushaf yang sama hingga sekarang.", "ar": null, "img": null}, {"type": "pg", "subject": "PAI", "cat": "Sejarah Peradaban Islam", "level": "HOTS", "q": "Keteladanan Khulafaur Rasyidin yang patut dicontoh siswa dalam kehidupan sehari-hari adalah ...", "opts": ["Hidup mewah dan berfoya-foya", "Sederhana, adil, dan bertanggung jawab dalam memimpin", "Mementingkan kepentingan pribadi", "Tidak peduli terhadap rakyat"], "ans": 1, "hint": "Para Khulafaur Rasyidin dikenal dengan kesederhanaan, keadilan, dan tanggung jawab besar dalam memimpin serta melayani umat.", "ar": null, "img": null}, {"type": "pg", "subject": "BTQ", "cat": "Hukum Nun Sukun dan Tanwin", "level": "Rendah", "q": "Apabila nun sukun atau tanwin bertemu huruf ba (ب), maka dibaca dengan hukum ...", "opts": ["Izhar", "Idgham", "Iqlab", "Ikhfa"], "ans": 2, "hint": "Nun sukun/tanwin bertemu ba dibaca iqlab, yaitu bunyi nun berubah menjadi mim disertai dengung.", "ar": null, "img": null}, {"type": "pg", "subject": "BTQ", "cat": "Hukum Nun Sukun dan Tanwin", "level": "Sedang", "q": "Perhatikan lafal berikut, tentukan hukum bacaannya!", "opts": ["Izhar halqi", "Ikhfa haqiqi", "Idgham bighunnah", "Iqlab"], "ans": 1, "hint": "Nun sukun bertemu huruf syin (ش) termasuk salah satu dari 15 huruf ikhfa, dibaca samar disertai dengung.", "ar": "مِنْ شَرِّ مَا خَلَقَ", "img": null}, {"type": "pg", "subject": "BTQ", "cat": "Hukum Nun Sukun dan Tanwin", "level": "HOTS", "q": "Perhatikan dua lafal berikut: 'مَنْ يَعْمَلْ' dan 'مِنْ رَبِّهِمْ'. Perbedaan hukum bacaan pada kedua lafal tersebut adalah ...", "opts": ["Keduanya dibaca izhar", "Lafal pertama idgham bighunnah, lafal kedua idgham bilaghunnah", "Lafal pertama ikhfa, lafal kedua iqlab", "Keduanya dibaca sama"], "ans": 1, "hint": "Nun sukun bertemu ya (ي) dibaca idgham bighunnah (melebur disertai dengung), sedangkan nun sukun bertemu ra (ر) dibaca idgham bilaghunnah (melebur tanpa dengung).", "ar": null, "img": null}, {"type": "bs", "subject": "BTQ", "cat": "Hukum Nun Sukun dan Tanwin", "level": "Rendah", "q": "Huruf-huruf izhar halqi berjumlah 6 huruf, yaitu hamzah, ha, 'ain, ha, ghain, dan kha.", "val": true, "hint": "Benar. Keenam huruf halq tersebut (ء ه ع ح غ خ) menyebabkan nun sukun/tanwin dibaca jelas (izhar).", "ar": null, "img": null}, {"type": "pg", "subject": "BTQ", "cat": "Hukum Mim Sukun", "level": "Sedang", "q": "Apabila mim sukun bertemu huruf mim, maka hukum bacaannya disebut ...", "opts": ["Idgham mimi", "Ikhfa syafawi", "Izhar syafawi", "Iqlab"], "ans": 0, "hint": "Mim sukun bertemu mim dibaca idgham mimi (mitslain), yaitu melebur disertai dengung.", "ar": null, "img": null}, {"type": "pg", "subject": "BTQ", "cat": "Hukum Mim Sukun", "level": "HOTS", "q": "Perhatikan lafal berikut, tentukan hukum bacaannya!", "opts": ["Idgham mimi", "Izhar syafawi", "Ikhfa syafawi", "Iqlab"], "ans": 2, "hint": "Mim sukun bertemu huruf ba dibaca ikhfa syafawi, yaitu dibaca samar-samar disertai dengung dengan bibir tertutup ringan.", "ar": "تَرْمِيهِمْ بِحِجَارَةٍ", "img": null}, {"type": "bs", "subject": "BTQ", "cat": "Hukum Mim Sukun", "level": "HOTS", "q": "Izhar syafawi terjadi apabila mim sukun bertemu semua huruf hijaiah selain mim dan ba, dan dibaca jelas tanpa dengung.", "val": true, "hint": "Benar. Selain bertemu mim (idgham mimi) dan ba (ikhfa syafawi), mim sukun bertemu huruf lain dibaca jelas (izhar syafawi).", "ar": null, "img": null}, {"type": "pg", "subject": "BTQ", "cat": "Hukum Tafkhim dan Tarqiq", "level": "Sedang", "q": "Huruf ra (ر) dibaca tebal (tafkhim) apabila berharakat ...", "opts": ["Fathah atau dhammah", "Kasrah", "Sukun setelah kasrah", "Tanwin kasrah"], "ans": 0, "hint": "Ra berharakat fathah atau dhammah dibaca tebal (tafkhim), sedangkan ra berharakat kasrah dibaca tipis (tarqiq).", "ar": null, "img": null}, {"type": "pg", "subject": "BTQ", "cat": "Hukum Tafkhim dan Tarqiq", "level": "HOTS", "q": "Huruf lam pada lafal Allah (الله) dibaca tebal apabila kata sebelumnya berharakat fathah atau dhammah, misalnya pada 'قَالَ اللهُ'. Sementara pada lafal 'بِسْمِ اللهِ', huruf lam dibaca ...", "opts": ["Tetap tebal karena posisi di awal ayat", "Tipis, karena huruf sebelumnya (mim) berharakat kasrah", "Tidak dibaca sama sekali", "Dengung panjang"], "ans": 1, "hint": "Lam jalalah dibaca tipis (tarqiq) apabila didahului huruf berharakat kasrah, seperti 'bismi' yang berakhiran kasrah sebelum lafal Allah.", "ar": null, "img": null}, {"type": "pg", "subject": "BTQ", "cat": "Mad Thabi'i, Mad Wajib, dan Mad Jaiz", "level": "Rendah", "q": "Mad thabi'i dibaca panjang selama ...", "opts": ["1 harakat", "2 harakat", "4 harakat", "6 harakat"], "ans": 1, "hint": "Mad thabi'i (mad asli) dibaca panjang 2 harakat atau setara satu alif.", "ar": null, "img": null}, {"type": "pg", "subject": "BTQ", "cat": "Mad Thabi'i, Mad Wajib, dan Mad Jaiz", "level": "Sedang", "q": "Mad wajib muttashil terjadi apabila mad thabi'i bertemu hamzah dalam ...", "opts": ["Kata yang berbeda", "Satu kata yang sama", "Awal surah", "Akhir ayat saja"], "ans": 1, "hint": "Mad wajib muttashil terjadi saat huruf mad bertemu hamzah dalam satu kata yang sama, dibaca panjang 4-5 harakat.", "ar": null, "img": null}, {"type": "pg", "subject": "BTQ", "cat": "Mad Thabi'i, Mad Wajib, dan Mad Jaiz", "level": "HOTS", "q": "Perhatikan dua lafal berikut: 'جَاءَ' (dalam satu kata) dan 'قَالُوا آمَنَّا' (dua kata terpisah). Hukum bacaan mad yang tepat untuk kedua lafal tersebut adalah ...", "opts": ["Keduanya mad thabi'i", "Lafal pertama mad wajib muttashil, lafal kedua mad jaiz munfashil", "Lafal pertama mad jaiz munfashil, lafal kedua mad wajib muttashil", "Keduanya mad lin"], "ans": 1, "hint": "Mad bertemu hamzah dalam satu kata disebut mad wajib muttashil, sedangkan mad bertemu hamzah pada kata yang berbeda (terpisah) disebut mad jaiz munfashil.", "ar": null, "img": null}, {"type": "pg", "subject": "BTQ", "cat": "Qalqalah", "level": "Rendah", "q": "Huruf-huruf qalqalah yang tepat adalah ...", "opts": ["ق ط ب ج د", "ن م و ي", "ب", "ء ه ع ح غ خ"], "ans": 0, "hint": "Huruf qalqalah ada 5, yaitu ق ط ب ج د, biasa disingkat 'Qathbu Jadin'.", "ar": null, "img": null}, {"type": "pg", "subject": "BTQ", "cat": "Qalqalah", "level": "HOTS", "q": "Perhatikan lafal berikut, tentukan hukum bacaannya!", "opts": ["Qalqalah sughra", "Qalqalah kubra", "Mad thabi'i", "Ghunnah"], "ans": 1, "hint": "Huruf ba pada akhir kata 'وَقَبْ' berharakat sukun karena diwaqafkan (bukan sukun asli), sehingga termasuk qalqalah kubra yang dipantulkan lebih kuat.", "ar": "وَمِن شَرِّ غَاسِقٍ إِذَا وَقَبْ", "img": null}, {"type": "pg", "subject": "BTQ", "cat": "Alif Lam Qomariah dan Syamsiah", "level": "Sedang", "q": "Alif lam qomariah dibaca dengan jelas, contohnya pada lafal ...", "opts": ["الشَّمْسُ", "الْقَمَرُ", "الرَّحْمَٰنُ", "النَّاسُ"], "ans": 1, "hint": "Alif lam bertemu huruf qamariah (seperti qaf) dibaca jelas, contohnya 'al-qamar'.", "ar": null, "img": null}, {"type": "bs", "subject": "BTQ", "cat": "Alif Lam Qomariah dan Syamsiah", "level": "HOTS", "q": "Alif lam syamsiah dibaca dengan melebur (idgham) ke huruf setelahnya sehingga bunyi lam tidak terdengar, contohnya pada lafal 'asy-syams'.", "val": true, "hint": "Benar. Alif lam bertemu huruf syamsiah dibaca lebur, sehingga huruf lam tidak diucapkan dan huruf berikutnya ditasydidkan.", "ar": null, "img": null}, {"type": "pg", "subject": "BTQ", "cat": "Membaca dan Menulis Huruf Hijaiah", "level": "Rendah", "q": "Jumlah huruf hijaiah yang umum diajarkan adalah ...", "opts": ["26 huruf", "27 huruf", "28 huruf", "30 huruf"], "ans": 2, "hint": "Huruf hijaiah umumnya diajarkan berjumlah 28 huruf, dari alif hingga ya.", "ar": null, "img": null}, {"type": "pg", "subject": "BTQ", "cat": "Membaca dan Menulis Huruf Hijaiah", "level": "Sedang", "q": "Cara menulis huruf hijaiah yang benar adalah dari arah ...", "opts": ["Kiri ke kanan", "Kanan ke kiri", "Atas ke bawah", "Bawah ke atas"], "ans": 1, "hint": "Huruf hijaiah (Arab) ditulis dan dibaca dari kanan ke kiri, berbeda dengan huruf Latin.", "ar": null, "img": null}, {"type": "pg", "subject": "BTQ", "cat": "Membaca dan Menulis Huruf Hijaiah", "level": "HOTS", "q": "Seorang siswa kesulitan membedakan huruf ب, ت, dan ث karena bentuknya mirip. Cara paling tepat untuk membedakannya adalah dengan memperhatikan ...", "opts": ["Ukuran hurufnya", "Jumlah dan letak titik pada huruf", "Warna tulisannya", "Panjang garis huruf"], "ans": 1, "hint": "Huruf ب, ت, ث memiliki bentuk dasar sama namun dibedakan oleh jumlah dan letak titik: ب (satu titik bawah), ت (dua titik atas), ث (tiga titik atas).", "ar": null, "img": null}, {"type": "pg", "subject": "BTQ", "cat": "Transliterasi Arab-Latin", "level": "HOTS", "q": "Transliterasi Arab-Latin dari huruf ص yang tepat menggunakan tanda baca khusus adalah ...", "opts": ["s", "ṣ", "sy", "z"], "ans": 1, "hint": "Huruf ص ditransliterasikan sebagai 'ṣ' (s dengan titik di bawah) untuk membedakannya dari huruf س (s biasa).", "ar": null, "img": null}, {"type": "bs", "subject": "BTQ", "cat": "Transliterasi Arab-Latin", "level": "HOTS", "q": "Dalam transliterasi Arab-Latin, huruf ذ ditulis 'ż' dan ز ditulis 'z' untuk membedakan kedua bunyi yang berbeda meskipun terdengar mirip bagi sebagian orang.", "val": true, "hint": "Benar. Sistem transliterasi ilmiah menggunakan tanda diakritik khusus (seperti ż, ṣ, ḥ, ṭ) agar setiap huruf Arab memiliki padanan Latin yang unik dan tidak tertukar.", "ar": null, "img": null}, {"type": "bs", "subject": "PAI", "cat": "Fiqih", "level": "HOTS", "q": "Shalat sunnah Duha dikerjakan pada waktu setelah matahari agak naik hingga menjelang waktu Zuhur.", "val": true, "hint": "Benar. Waktu shalat Duha dimulai sejak matahari naik sekitar sepenggalah hingga menjelang tergelincirnya matahari (waktu Zuhur).", "ar": null, "img": null}, {"type": "bs", "subject": "PAI", "cat": "Sejarah Peradaban Islam", "level": "Rendah", "q": "Khulafaur Rasyidin terdiri dari empat khalifah, yaitu Abu Bakar, Umar bin Khattab, Utsman bin Affan, dan Ali bin Abi Thalib.", "val": true, "hint": "Benar. Keempat khalifah tersebut dikenal sebagai Khulafaur Rasyidin (para pemimpin yang mendapat petunjuk) setelah wafatnya Nabi Muhammad ﷺ.", "ar": null, "img": null}, {"type": "pg", "subject": "BTQ", "cat": "Membaca dan Menulis Huruf Hijaiah", "level": "HOTS", "q": "Huruf hijaiah yang tidak dapat disambung dengan huruf setelahnya dalam satu kata, di antaranya adalah ...", "opts": ["ب ت ث", "ا د ذ ر ز و", "ج ح خ", "س ش ص"], "ans": 1, "hint": "Enam huruf (ا د ذ ر ز و) termasuk huruf yang tidak dapat disambung ke huruf sesudahnya, sehingga selalu terlihat 'terputus' meski berada di tengah kata.", "ar": null, "img": null}, {"type": "bs", "subject": "BTQ", "cat": "Hukum Nun Sukun dan Tanwin", "level": "Rendah", "q": "Ikhfa artinya membaca nun sukun/tanwin dengan jelas tanpa dengung sama sekali.", "val": false, "hint": "Salah. Ikhfa dibaca samar-samar disertai dengung, bukan dibaca jelas. Yang dibaca jelas tanpa dengung adalah hukum izhar.", "ar": null, "img": null}], "matches": [{"type": "match", "subject": "PAI", "title": "Jodohkanlah nama Nabi/Rasul berikut dengan mukjizatnya yang tepat dengan menarik garis!", "pairs": [["Nabi Musa a.s.", "Tongkat berubah menjadi ular"], ["Nabi Ibrahim a.s.", "Selamat dari kobaran api"], ["Nabi Sulaiman a.s.", "Dapat berbicara dengan hewan"], ["Nabi Isa a.s.", "Menyembuhkan orang sakit dengan izin Allah"], ["Nabi Nuh a.s.", "Membuat kapal besar sebelum banjir"], ["Nabi Yunus a.s.", "Selamat di dalam perut ikan besar"], ["Nabi Muhammad ﷺ", "Al-Qur'an sebagai mukjizat abadi"], ["Nabi Saleh a.s.", "Unta betina keluar dari batu"]], "level": "Sedang"}, {"type": "match", "subject": "BTQ", "title": "Jodohkanlah huruf hijaiah berikut dengan nama hukum tajwidnya yang tepat dengan menarik garis!", "pairs": [["ق ط ب ج د", "Huruf Qalqalah"], ["ء ه ع ح غ خ", "Huruf Izhar Halqi"]], "level": "Sedang"}]}, "Paket B": {"name": "Paket B", "items": [{"type": "pg", "subject": "PAI", "cat": "Al-Qur'an Hadits", "level": "Sedang", "q": "Perhatikan potongan ayat berikut!", "opts": ["Al-Fatihah", "An-Nas", "Al-Ikhlas", "Al-Falaq"], "ans": 3, "hint": "Ayat ini adalah bagian dari surah Al-Falaq yang memohon perlindungan dari kejahatan makhluk pada waktu subuh/pagi.", "ar": "مِن شَرِّ مَا خَلَقَ", "img": null}, {"type": "pg", "subject": "PAI", "cat": "Al-Qur'an Hadits", "level": "HOTS", "q": "Seorang siswa akan menghadapi ujian dan merasa cemas berlebihan. Ia ingin membaca surah yang mengingatkan bahwa Allah Maha Esa dan tempat bergantung segala sesuatu. Surah yang paling tepat adalah ...", "opts": ["Al-Ma'un", "Al-Ikhlas", "Al-Fil", "Al-Kafirun"], "ans": 1, "hint": "Surah Al-Ikhlas menegaskan keesaan Allah (Ahad) dan bahwa Dialah tempat bergantung (Ash-Shamad), sehingga menenangkan hati yang cemas dengan mengingat kebesaran-Nya.", "ar": null, "img": null}, {"type": "bs", "subject": "PAI", "cat": "Al-Qur'an Hadits", "level": "HOTS", "q": "Surah Al-Ma'un menjelaskan tentang ciri-ciri orang yang mendustakan agama, salah satunya enggan menolong sesama dengan barang berguna.", "val": true, "hint": "Benar. Ayat terakhir surah Al-Ma'un menyebut 'wa yamna'unal ma'un' (enggan memberi bantuan berupa barang berguna) sebagai ciri pendusta agama.", "ar": null, "img": null}, {"type": "pg", "subject": "PAI", "cat": "Al-Qur'an Hadits", "level": "Sedang", "q": "Kisah pasukan bergajah yang dihancurkan burung Ababil terdapat dalam surah ...", "opts": ["Al-Kautsar", "Al-Fil", "Al-Kafirun", "At-Tin"], "ans": 1, "hint": "Surah Al-Fil menceritakan kehancuran pasukan bergajah pimpinan Abrahah yang hendak menghancurkan Ka'bah.", "ar": null, "img": null}, {"type": "pg", "subject": "PAI", "cat": "Al-Qur'an Hadits", "level": "HOTS", "q": "Surah Al-Kafirun ditutup dengan ayat 'lakum dinukum waliyadin'. Jika ada teman mengajak salah satu siswa muslim untuk ikut serta dalam ritual ibadah agama lain, sikap yang sesuai ayat tersebut adalah ...", "opts": ["Ikut serta agar tidak menyinggung perasaan teman", "Menolak dengan sopan karena akidah masing-masing harus dijaga", "Marah dan memutus pertemanan", "Ikut sebagian saja ritualnya"], "ans": 1, "hint": "'Lakum dinukum waliyadin' (untukmu agamamu, untukku agamaku) mengajarkan menolak dengan sopan keikutsertaan dalam ritual ibadah agama lain sambil tetap menjaga hubungan baik.", "ar": null, "img": null}, {"type": "bs", "subject": "PAI", "cat": "Al-Qur'an Hadits", "level": "HOTS", "q": "Surah Al-Kautsar diturunkan sebagai kabar gembira bahwa Nabi Muhammad ﷺ diberi nikmat yang sangat banyak oleh Allah.", "val": true, "hint": "Benar. Al-Kautsar berarti nikmat yang banyak, menjadi penghibur bagi Nabi ﷺ atas cemoohan kaum kafir yang menyebutnya terputus keturunan.", "ar": null, "img": null}, {"type": "pg", "subject": "PAI", "cat": "Al-Qur'an Hadits", "level": "HOTS", "q": "Surah Ad-Duha mengandung pesan bahwa Allah tidak pernah meninggalkan hamba-Nya, ditunjukkan dengan larangan untuk ...", "opts": ["Menghardik anak yatim dan menghina peminta-minta", "Berdagang", "Bepergian jauh", "Menikah"], "ans": 0, "hint": "Ad-Duha memerintahkan untuk tidak menghardik anak yatim dan tidak menghardik peminta-minta sebagai wujud syukur atas nikmat Allah.", "ar": null, "img": null}, {"type": "pg", "subject": "PAI", "cat": "Al-Qur'an Hadits", "level": "HOTS", "q": "Surah Al-'Alaq ayat 1-5 dimulai dengan perintah 'iqra' (bacalah). Jika dikaitkan dengan kehidupan modern saat ini, pesan utama ayat tersebut yang relevan bagi pelajar adalah ...", "opts": ["Belajar tidak penting jika sudah punya internet", "Ilmu pengetahuan harus dicari melalui membaca dan belajar sebagai bentuk ibadah", "Cukup membaca satu buku saja seumur hidup", "Membaca hanya boleh dilakukan oleh orang dewasa"], "ans": 1, "hint": "Perintah 'iqra' menekankan pentingnya budaya membaca dan mencari ilmu sepanjang hayat sebagai wujud ibadah dan pengembangan diri.", "ar": null, "img": null}, {"type": "pg", "subject": "PAI", "cat": "Al-Qur'an Hadits", "level": "HOTS", "q": "Perhatikan potongan ayat berikut yang menjelaskan tentang kemuliaan manusia berdasarkan ketakwaan!", "opts": ["Al-Hujurat ayat 13", "Ali Imran ayat 64", "Al-Baqarah ayat 256", "Al-Kautsar"], "ans": 0, "hint": "Ayat ini menegaskan bahwa manusia diciptakan berbangsa-bangsa dan bersuku-suku untuk saling mengenal, dan yang paling mulia di sisi Allah adalah yang paling bertakwa.", "ar": "إِنَّ أَكْرَمَكُمْ عِندَ اللَّهِ أَتْقَاكُمْ", "img": null}, {"type": "pg", "subject": "PAI", "cat": "Al-Qur'an Hadits", "level": "HOTS", "q": "Surah Ali Imran ayat 64 mengajak ahli kitab kepada satu kalimat yang sama (kalimatun sawa'), yaitu untuk hanya menyembah Allah dan tidak mempersekutukan-Nya. Nilai yang dapat dipetik dari ayat ini adalah ...", "opts": ["Semua agama sama saja", "Pentingnya dakwah dengan mengajak pada titik temu kebaikan bersama secara bijaksana", "Tidak perlu berdakwah kepada siapa pun", "Ahli kitab tidak boleh diajak berdialog"], "ans": 1, "hint": "Ayat ini mengajarkan strategi dakwah yang bijaksana dengan mencari titik temu (kalimatun sawa') dalam berdialog, yaitu penyembahan hanya kepada Allah semata.", "ar": null, "img": null}, {"type": "bs", "subject": "PAI", "cat": "Al-Qur'an Hadits", "level": "Rendah", "q": "Surah Al-Baqarah ayat 256 menegaskan bahwa tidak ada paksaan dalam memeluk agama Islam.", "val": true, "hint": "Benar. Ayat 'la ikraha fid din' menegaskan prinsip kebebasan beragama tanpa paksaan dalam Islam.", "ar": null, "img": null}, {"type": "pg", "subject": "PAI", "cat": "Al-Qur'an Hadits", "level": "Sedang", "q": "Hadis tentang keragaman mengajarkan umat Islam untuk ...", "opts": ["Menjauhi orang yang berbeda suku", "Saling mengenal dan menghormati perbedaan sebagai sunnatullah", "Memaksakan pendapat sendiri", "Membenci budaya lain"], "ans": 1, "hint": "Hadis dan ajaran Islam tentang keragaman menekankan pentingnya saling mengenal, menghormati, dan hidup berdampingan dalam perbedaan.", "ar": null, "img": null}, {"type": "pg", "subject": "PAI", "cat": "Aqidah", "level": "Sedang", "q": "Asmaul husna \"Al-Malik\" mengajarkan bahwa Allah adalah ...", "opts": ["Yang Maha Merajai/menguasai seluruh alam semesta", "Yang Maha Pengampun", "Yang Maha Pemberi rezeki", "Yang Maha Menghidupkan"], "ans": 0, "hint": "Al-Malik berarti Allah Maha Merajai, yaitu pemilik dan penguasa mutlak atas seluruh alam semesta.", "ar": null, "img": null}, {"type": "pg", "subject": "PAI", "cat": "Aqidah", "level": "HOTS", "q": "Seorang anak merasa sombong karena keluarganya kaya raya. Asmaul husna yang paling tepat mengingatkannya bahwa segala kekayaan hanyalah titipan dan kekuasaan mutlak ada pada Allah adalah ...", "opts": ["Al-'Azīz dan Al-Afuww", "Al-Malik dan Al-Wahhab", "Al-Hayyu", "Al-Mumit"], "ans": 1, "hint": "Al-Malik (Maha Merajai) mengingatkan bahwa kekuasaan sejati ada pada Allah, sedangkan Al-Wahhab (Maha Pemberi karunia) mengingatkan bahwa harta adalah pemberian Allah, bukan hasil kesombongan pribadi.", "ar": null, "img": null}, {"type": "bs", "subject": "PAI", "cat": "Aqidah", "level": "Rendah", "q": "Asmaul husna \"Al-'Azīz\" berarti Allah Maha Perkasa/Mulia, tidak ada yang dapat mengalahkan kekuasaan-Nya.", "val": true, "hint": "Benar. Al-'Azīz menunjukkan bahwa Allah memiliki kemuliaan dan keperkasaan mutlak yang tidak tertandingi.", "ar": null, "img": null}, {"type": "pg", "subject": "PAI", "cat": "Aqidah", "level": "Sedang", "q": "Asmaul husna \"Al-'Afuww\" mengajarkan sifat ...", "opts": ["Pemaaf, sehingga kita dianjurkan saling memaafkan", "Pemarah", "Pendendam", "Acuh tak acuh"], "ans": 0, "hint": "Al-'Afuww berarti Allah Maha Pemaaf; sifat ini mengajarkan manusia untuk juga memiliki sikap pemaaf terhadap sesama.", "ar": null, "img": null}, {"type": "pg", "subject": "PAI", "cat": "Aqidah", "level": "HOTS", "q": "Seorang siswa pernah dikhianati temannya, namun ia memilih memaafkan dan tetap berteman baik. Sikap ini mencerminkan keteladanan dari asmaul husna ...", "opts": ["Al-Qayyum", "Al-'Afuww", "Al-Mumit", "Al-Malik"], "ans": 1, "hint": "Meneladani Al-'Afuww (Maha Pemaaf) berarti membiasakan diri memaafkan kesalahan orang lain sebagaimana Allah Maha Pemaaf kepada hamba-Nya.", "ar": null, "img": null}, {"type": "pg", "subject": "PAI", "cat": "Aqidah", "level": "Rendah", "q": "Rukun iman yang pertama adalah beriman kepada ...", "opts": ["Allah Swt.", "Malaikat", "Kitab", "Rasul"], "ans": 0, "hint": "Rukun iman yang pertama dan paling utama adalah beriman kepada Allah Swt.", "ar": null, "img": null}, {"type": "pg", "subject": "PAI", "cat": "Aqidah", "level": "Sedang", "q": "Beriman kepada rasul-rasul Allah berarti meyakini bahwa ...", "opts": ["Rasul diutus untuk menyampaikan wahyu dan membimbing manusia ke jalan yang benar", "Rasul adalah malaikat yang menyerupai manusia", "Hanya perlu percaya pada satu rasul saja", "Rasul tidak memiliki tugas khusus"], "ans": 0, "hint": "Iman kepada rasul berarti meyakini bahwa para rasul diutus Allah untuk menyampaikan wahyu dan membimbing umatnya menuju jalan kebenaran.", "ar": null, "img": null}, {"type": "bs", "subject": "PAI", "cat": "Aqidah", "level": "HOTS", "q": "Beriman kepada hari akhir berarti meyakini bahwa seluruh amal perbuatan manusia di dunia akan dipertanggungjawabkan di akhirat kelak.", "val": true, "hint": "Benar. Iman kepada hari akhir mendorong manusia untuk berhati-hati dalam bertindak karena semua amal akan dimintai pertanggungjawaban.", "ar": null, "img": null}, {"type": "pg", "subject": "PAI", "cat": "Aqidah", "level": "HOTS", "q": "Seorang siswa merasa hidupnya tidak adil karena usahanya belum membuahkan hasil, sementara temannya yang kurang berusaha justru berhasil. Pemahaman iman kepada qada dan qadar yang tepat untuk menyikapi hal ini adalah ...", "opts": ["Semua sudah ditakdirkan sehingga tidak perlu berusaha lagi", "Tetap berikhtiar maksimal, meyakini hikmah di balik ketetapan Allah, dan bertawakal", "Iri dan berhenti berusaha", "Menyalahkan Allah atas ketidakadilan"], "ans": 1, "hint": "Iman kepada qada dan qadar mengajarkan untuk terus berikhtiar, meyakini ada hikmah di balik setiap ketetapan Allah, dan menyerahkan hasil akhir kepada-Nya (tawakal) tanpa berputus asa atau iri hati.", "ar": null, "img": null}, {"type": "pg", "subject": "PAI", "cat": "Akhlak", "level": "Rendah", "q": "Kalimat yang diucapkan untuk memulai suatu pekerjaan agar mendapat berkah Allah adalah ...", "opts": ["Hamdalah", "Basmalah", "Takbir", "Istighfar"], "ans": 1, "hint": "Basmalah (bismillahirrahmanirrahim) diucapkan untuk memohon berkah dan pertolongan Allah saat memulai suatu pekerjaan.", "ar": null, "img": null}, {"type": "pg", "subject": "PAI", "cat": "Akhlak", "level": "HOTS", "q": "Dito melihat pengemis tua kehujanan di pinggir jalan dan merasa iba sehingga ia memberikan payung dan makanannya. Sikap Dito ini mencerminkan akhlak ...", "opts": ["Empati", "Munafik", "Sombong", "Riya"], "ans": 0, "hint": "Empati adalah kepekaan merasakan penderitaan orang lain yang mendorong seseorang untuk bertindak membantu, seperti yang dilakukan Dito.", "ar": null, "img": null}, {"type": "bs", "subject": "PAI", "cat": "Akhlak", "level": "Rendah", "q": "Jujur berarti berkata dan bertindak sesuai dengan kenyataan yang sebenarnya, tanpa menutup-nutupi kebenaran.", "val": true, "hint": "Benar. Kejujuran adalah kesesuaian antara ucapan, perbuatan, dan kenyataan yang sebenarnya.", "ar": null, "img": null}, {"type": "pg", "subject": "PAI", "cat": "Akhlak", "level": "Sedang", "q": "Salah satu bentuk bakti seorang anak kepada guru di sekolah adalah ...", "opts": ["Mengabaikan nasihatnya", "Mendengarkan dan mengamalkan ilmu yang diajarkan dengan hormat", "Membantah setiap perkataan guru", "Datang terlambat setiap hari"], "ans": 1, "hint": "Bakti kepada guru ditunjukkan dengan menghormati, mendengarkan, dan mengamalkan ilmu yang diajarkan dengan sungguh-sungguh.", "ar": null, "img": null}, {"type": "pg", "subject": "PAI", "cat": "Akhlak", "level": "HOTS", "q": "Ayah Doni sedang sakit dan membutuhkan istirahat, namun Doni ingin menonton televisi dengan suara keras. Sikap berbakti yang tepat ditunjukkan Doni adalah ...", "opts": ["Tetap menonton dengan suara keras karena itu haknya", "Mengecilkan suara televisi atau menundanya demi kenyamanan ayahnya yang sakit", "Pergi bermain di luar tanpa pamit", "Marah karena tidak boleh menonton"], "ans": 1, "hint": "Berbakti kepada orang tua berarti mengutamakan kenyamanan dan kesehatan mereka, seperti mengalah dan menjaga ketenangan saat orang tua sedang sakit.", "ar": null, "img": null}, {"type": "pg", "subject": "PAI", "cat": "Akhlak", "level": "HOTS", "q": "Menghormati orang lain tanpa memandang status sosial, kaya atau miskin, termasuk akhlak ...", "opts": ["Tercela", "Terpuji", "Berlebihan", "Tidak dianjurkan"], "ans": 1, "hint": "Islam mengajarkan untuk menghormati semua orang secara setara tanpa memandang status sosial atau kekayaan.", "ar": null, "img": null}, {"type": "pg", "subject": "PAI", "cat": "Akhlak", "level": "HOTS", "q": "Di sekolah terdapat siswa pindahan dari daerah lain dengan logat bahasa dan kebiasaan berbeda. Sikap yang mencerminkan menghargai keragaman adalah ...", "opts": ["Menirukan logatnya untuk mengejek", "Menyambut baik dan belajar memahami perbedaan budayanya", "Menjauhinya karena berbeda", "Memaksanya mengikuti kebiasaan mayoritas"], "ans": 1, "hint": "Menghargai keragaman berarti menyambut baik perbedaan latar belakang dan berusaha saling memahami, bukan mengejek atau memaksakan kehendak.", "ar": null, "img": null}, {"type": "bs", "subject": "PAI", "cat": "Akhlak", "level": "HOTS", "q": "Memberi maaf kepada orang yang bersalah kepada kita termasuk akhlak yang sangat dianjurkan, meskipun kita berhak untuk marah.", "val": true, "hint": "Benar. Islam sangat menganjurkan sikap pemaaf karena dapat menenangkan hati dan mempererat hubungan persaudaraan.", "ar": null, "img": null}, {"type": "pg", "subject": "PAI", "cat": "Akhlak", "level": "Rendah", "q": "Mengucapkan 'jazakallahu khairan' (semoga Allah membalas dengan kebaikan) merupakan bentuk ...", "opts": ["Berterima kasih", "Meminta maaf", "Berdoa untuk keburukan", "Mengejek"], "ans": 0, "hint": "Ucapan 'jazakallahu khairan' adalah bentuk berterima kasih sekaligus mendoakan kebaikan bagi orang yang telah berbuat baik kepada kita.", "ar": null, "img": null}, {"type": "pg", "subject": "PAI", "cat": "Akhlak", "level": "HOTS", "q": "Membiasakan diri mengerjakan tugas sekolah tepat waktu tanpa menunda-nunda merupakan wujud sikap ...", "opts": ["Disiplin", "Sombong", "Malas", "Boros"], "ans": 0, "hint": "Disiplin adalah sikap taat terhadap aturan dan tanggung jawab, termasuk mengerjakan tugas tepat waktu.", "ar": null, "img": null}, {"type": "pg", "subject": "PAI", "cat": "Akhlak", "level": "HOTS", "q": "Sekolah mewajibkan seluruh siswa membawa tempat minum sendiri untuk mengurangi sampah plastik. Kebijakan ini paling sesuai dengan penerapan sikap ...", "opts": ["Gaya hidup bersih dan peduli lingkungan", "Sombong", "Boros", "Munafik"], "ans": 0, "hint": "Membiasakan gaya hidup bersih dan mengurangi sampah mencerminkan kepedulian terhadap lingkungan sesuai ajaran Islam untuk menjaga kelestarian alam.", "ar": null, "img": null}, {"type": "pg", "subject": "PAI", "cat": "Akhlak", "level": "HOTS", "q": "Perkataan yang baik dan mengandung kebaikan seperti 'assalamu'alaikum' dan 'alhamdulillah' termasuk ...", "opts": ["Kalimah thayyibah", "Kalimah sayyi'ah", "Ghibah", "Fitnah"], "ans": 0, "hint": "Kalimah thayyibah adalah ucapan-ucapan baik yang dianjurkan diucapkan dalam kehidupan sehari-hari, seperti salam dan hamdalah.", "ar": null, "img": null}, {"type": "bs", "subject": "PAI", "cat": "Akhlak", "level": "HOTS", "q": "Seorang anak selalu berkata manis dan berjanji akan membantu, namun tidak pernah menepati janjinya dan sering berbohong ketika diminta pertanggungjawaban. Sikap ini termasuk ciri munafik.", "val": true, "hint": "Benar. Ciri munafik menurut hadis adalah berdusta ketika berbicara, mengingkari janji, dan berkhianat ketika diberi amanah.", "ar": null, "img": null}, {"type": "pg", "subject": "PAI", "cat": "Akhlak", "level": "HOTS", "q": "Membantu teman yang kesulitan memahami pelajaran tanpa mengharap imbalan termasuk sikap ...", "opts": ["Menolong", "Munafik", "Sombong", "Riya"], "ans": 0, "hint": "Menolong sesama tanpa pamrih adalah akhlak terpuji yang sangat dianjurkan dalam Islam.", "ar": null, "img": null}, {"type": "pg", "subject": "PAI", "cat": "Akhlak", "level": "HOTS", "q": "Made yang beragama Hindu mengajak Fina yang muslim untuk mengerjakan tugas kelompok bersama. Sikap Fina yang mencerminkan akhlak berteman tanpa membedakan agama adalah ...", "opts": ["Menolak karena berbeda agama", "Menerima ajakan tersebut dan bekerja sama dengan baik dalam hal kebaikan sosial", "Ikut serta dalam ritual ibadah Made", "Bersikap dingin dan tidak kooperatif"], "ans": 1, "hint": "Islam mengajarkan untuk tetap bekerja sama dan bergaul baik dengan siapa pun dalam hal-hal duniawi/sosial tanpa membedakan agama, selama tidak mencampuri masalah akidah dan ibadah.", "ar": null, "img": null}, {"type": "pg", "subject": "PAI", "cat": "Fiqih", "level": "Rendah", "q": "Kalimat yang diucapkan sesaat sebelum shalat berjamaah dimulai, setelah azan, disebut ...", "opts": ["Iqamah", "Takbiratul ihram", "Tasyahud", "Salam"], "ans": 0, "hint": "Iqamah dikumandangkan tepat sebelum shalat berjamaah dimulai sebagai tanda shalat akan segera dilaksanakan.", "ar": null, "img": null}, {"type": "pg", "subject": "PAI", "cat": "Fiqih", "level": "Sedang", "q": "Shalat Zuhur dan Ashar masing-masing dikerjakan sebanyak ...", "opts": ["2 rakaat", "3 rakaat", "4 rakaat", "5 rakaat"], "ans": 2, "hint": "Shalat Zuhur dan Ashar masing-masing terdiri dari 4 rakaat.", "ar": null, "img": null}, {"type": "pg", "subject": "PAI", "cat": "Fiqih", "level": "HOTS", "q": "Seorang anak laki-laki berusia 13 tahun mengalami mimpi basah untuk pertama kalinya. Konsekuensi syariat yang berlaku baginya sejak saat itu adalah ...", "opts": ["Belum wajib menjalankan shalat", "Sudah dianggap balig sehingga wajib menjalankan seluruh syariat (mukalaf)", "Hanya wajib puasa saja", "Bebas dari segala kewajiban"], "ans": 1, "hint": "Mimpi basah adalah tanda balig bagi laki-laki. Setelah balig, seseorang menjadi mukalaf yang wajib menjalankan seluruh kewajiban syariat seperti shalat, puasa, dan lainnya.", "ar": null, "img": null}, {"type": "bs", "subject": "PAI", "cat": "Fiqih", "level": "Rendah", "q": "Usia balig bagi perempuan salah satunya ditandai dengan datangnya haid.", "val": true, "hint": "Benar. Haid adalah salah satu tanda balig bagi perempuan yang menjadikannya mukalaf (wajib menjalankan syariat).", "ar": null, "img": null}, {"type": "pg", "subject": "PAI", "cat": "Fiqih", "level": "HOTS", "q": "Zakat yang wajib dikeluarkan berupa bahan makanan pokok menjelang Idul Fitri disebut zakat ...", "opts": ["Mal", "Fitrah", "Profesi", "Pertanian"], "ans": 1, "hint": "Zakat fitrah dikeluarkan menjelang Idul Fitri berupa makanan pokok untuk mensucikan diri dan membantu fakir miskin.", "ar": null, "img": null}, {"type": "pg", "subject": "PAI", "cat": "Fiqih", "level": "HOTS", "q": "Pak Ali ingin bersedekah namun bingung menentukan jumlahnya karena penghasilannya tidak menentu. Ketentuan yang tepat mengenai sedekah dibandingkan zakat adalah ...", "opts": ["Sedekah juga memiliki nisab dan haul seperti zakat", "Sedekah bersifat sukarela tanpa ketentuan jumlah, waktu, atau nisab tertentu", "Sedekah hanya boleh berupa uang", "Sedekah wajib dikeluarkan setiap bulan"], "ans": 1, "hint": "Berbeda dengan zakat yang memiliki syarat nisab dan haul, sedekah bersifat sukarela sehingga dapat diberikan kapan saja dan berapa saja sesuai kemampuan.", "ar": null, "img": null}, {"type": "pg", "subject": "PAI", "cat": "Fiqih", "level": "Sedang", "q": "Berikut ini termasuk makanan yang halal untuk dikonsumsi umat Islam adalah ...", "opts": ["Daging babi", "Daging yang disembelih sesuai syariat dan bergizi baik", "Bangkai", "Darah"], "ans": 1, "hint": "Makanan halal adalah makanan yang diperbolehkan syariat, seperti daging yang disembelih dengan cara yang benar dan bergizi baik, sedangkan babi, bangkai, dan darah termasuk haram.", "ar": null, "img": null}, {"type": "bs", "subject": "PAI", "cat": "Fiqih", "level": "HOTS", "q": "Bersuci dari hadas besar seperti junub dilakukan dengan mandi wajib, bukan hanya dengan berwudu.", "val": true, "hint": "Benar. Hadas besar (seperti junub) disucikan dengan mandi wajib, sedangkan wudu hanya menyucikan dari hadas kecil.", "ar": null, "img": null}, {"type": "pg", "subject": "PAI", "cat": "Fiqih", "level": "HOTS", "q": "Seorang musafir dalam perjalanan jauh di padang pasir tidak menemukan air sama sekali menjelang waktu shalat. Cara bersuci yang tepat baginya adalah ...", "opts": ["Menunda shalat sampai menemukan air walau melewati waktu", "Bertayamum menggunakan debu suci sebagai pengganti wudu", "Shalat tanpa bersuci", "Membatalkan kewajiban shalat"], "ans": 1, "hint": "Ketika tidak ada air atau ada uzur syar'i, seseorang boleh bertayamum menggunakan debu suci sebagai pengganti wudu agar tetap dapat melaksanakan shalat pada waktunya.", "ar": null, "img": null}, {"type": "pg", "subject": "PAI", "cat": "Fiqih", "level": "Rendah", "q": "Mengingat Allah dengan mengucapkan kalimat tasbih, tahmid, dan takbir disebut ...", "opts": ["Zikir", "Sujud", "Rukuk", "Iktikaf"], "ans": 0, "hint": "Zikir adalah aktivitas mengingat Allah melalui bacaan seperti tasbih (subhanallah), tahmid (alhamdulillah), dan takbir (Allahu akbar).", "ar": null, "img": null}, {"type": "pg", "subject": "PAI", "cat": "Fiqih", dak sehat", "Sombong antarkelas", "Boros anggaran sekolah"], "ans": 0, "hint": "Lomba kebersihan mendorong siswa membiasakan gaya hidup bersih dan peduli terhadap kebersihan lingkungan bersama.", "ar": null, "img": null}, {"type": "pg", "subject": "PAI", "cat": "Akhlak", "level": "Sedang", "q": "Ucapan-ucapan baik yang dianjurkan diucapkan sehari-hari disebut ...", "opts": ["Kalimah thayyibah", "Kalimah sayyi'ah", "Ghibah", "Namimah"], "ans": 0, "hint": "Kalimah thayyibah adalah perkataan baik yang mengandung kebaikan dan pahala bila diucapkan.", "ar": null, "img": null}, {"type": "bs", "subject": "PAI", "cat": "Akhlak", "level": "HOTS", "q": "Seorang anak selalu tampil taat beribadah di sekolah untuk mendapat pujian guru, namun ia sering mengingkari janji dan berbohong kepada teman-temannya di luar sekolah. Perilaku ini termasuk ciri munafik.", "val": true, "hint": "Benar. Berpura-pura taat demi pujian sambil menyembunyikan kebiasaan berdusta dan mengingkari janji adalah ciri kemunafikan yang dijelaskan dalam hadis.", "ar": null, "img": null}, {"type": "pg", "subject": "PAI", "cat": "Akhlak", "level": "HOTS", "q": "Membantu teman yang kesulitan membawa barang berat tanpa diminta termasuk sikap ...", "opts": ["Menolong", "Sombong", "Riya", "Munafik"], "ans": 0, "hint": "Menolong sesama secara sukarela tanpa diminta mencerminkan kepedulian dan akhlak terpuji.", "ar": null, "img": null}, {"type": "pg", "subject": "PAI", "cat": "Akhlak", "level": "HOTS", "q": "Toni berteman baik dengan Budi yang berbeda agama. Ketika Budi kesulitan memahami pelajaran matematika, Toni dengan senang hati mengajarinya. Sikap Toni mencerminkan ...", "opts": ["Munafik", "Berteman tanpa membedakan agama", "Fanatisme sempit", "Riya"], "ans": 1, "hint": "Islam mengajarkan untuk saling membantu dalam kebaikan sosial tanpa membedakan agama, selama tidak mencampuri urusan akidah dan ibadah masing-masing.", "ar": null, "img": null}, {"type": "pg", "subject": "PAI", "cat": "Akhlak", "level": "HOTS", "q": "Tidak membuang sampah sembarangan dan menanam pohon di lingkungan sekitar merupakan wujud sikap ...", "opts": ["Peduli lingkungan", "Boros", "Malas", "Sombong"], "ans": 0, "hint": "Peduli lingkungan adalah tanggung jawab manusia sebagai khalifah di bumi untuk menjaga kelestarian alam.", "ar": null, "img": null}, {"type": "pg", "subject": "PAI", "cat": "Fiqih", "level": "Rendah", "q": "Seruan yang dikumandangkan untuk memberitahukan masuknya waktu shalat disebut ...", "opts": ["Azan", "Iqamah", "Takbir", "Tasbih"], "ans": 0, "hint": "Azan dikumandangkan sebagai tanda telah masuknya waktu shalat.", "ar": null, "img": null}, {"type": "pg", "subject": "PAI", "cat": "Fiqih", "level": "Sedang", "q": "Shalat Maghrib dikerjakan sebanyak ...", "opts": ["2 rakaat", "3 rakaat", "4 rakaat", "5 rakaat"], "ans": 1, "hint": "Shalat Maghrib terdiri dari 3 rakaat.", "ar": null, "img": null}, {"type": "pg", "subject": "PAI", "cat": "Fiqih", "level": "HOTS", "q": "Seorang anak perempuan mengalami haid untuk pertama kali di usia 11 tahun. Konsekuensi fiqih yang berlaku baginya sejak itu adalah ...", "opts": ["Ia sudah dianggap balig dan wajib menjalankan seluruh syariat", "Ia belum wajib shalat", "Ia hanya wajib berpuasa", "Tidak ada perubahan kewajiban apa pun"], "ans": 0, "hint": "Haid adalah tanda balig bagi perempuan. Setelah balig, seseorang menjadi mukalaf yang wajib menjalankan seluruh kewajiban syariat.", "ar": null, "img": null}, {"type": "bs", "subject": "PAI", "cat": "Fiqih", "level": "HOTS", "q": "Zakat wajib dikeluarkan apabila harta telah mencapai nisab dan dimiliki selama satu tahun penuh (haul), kecuali zakat pertanian dan zakat fitrah yang memiliki ketentuan berbeda.", "val": true, "hint": "Benar. Zakat mal umumnya mensyaratkan nisab dan haul, sedangkan zakat pertanian dikeluarkan setiap panen dan zakat fitrah dikeluarkan menjelang Idul Fitri tanpa syarat haul.", "ar": null, "img": null}, {"type": "pg", "subject": "PAI", "cat": "Fiqih", "level": "HOTS", "q": "Bu Sari ingin membantu tetangganya yang sedang kesulitan, namun bingung karena penghasilannya juga pas-pasan. Ketentuan yang paling tepat mengenai sedekah adalah ...", "opts": ["Sedekah hanya boleh dilakukan oleh orang kaya", "Sedekah bisa diberikan sesuai kemampuan, sekecil apa pun bentuknya, karena bersifat sukarela", "Sedekah wajib berupa uang dalam jumlah besar", "Sedekah hanya sah jika mencapai nisab"], "ans": 1, "hint": "Sedekah bersifat sukarela dan dapat diberikan sesuai kemampuan tanpa syarat jumlah minimal, bahkan senyuman pun dapat bernilai sedekah.", "ar": null, "img": null}, {"type": "pg", "subject": "PAI", "cat": "Fiqih", "level": "HOTS", "q": "Berikut ini adalah contoh perbuatan yang termasuk haram menurut syariat Islam, yaitu ...", "opts": ["Mencuri dan berjudi", "Bersedekah", "Bekerja mencari nafkah halal", "Menuntut ilmu"], "ans": 0, "hint": "Mencuri dan berjudi termasuk perbuatan yang diharamkan karena merugikan diri sendiri dan orang lain.", "ar": null, "img": null}, {"type": "pg", "subject": "PAI", "cat": "Fiqih", "level": "Rendah", "q": "Bersuci dari hadas kecil sebelum shalat dilakukan dengan cara ...", "opts": ["Mandi wajib", "Berwudu", "Tayamum saja tanpa uzur", "Puasa"], "ans": 1, "hint": "Wudu adalah cara bersuci dari hadas kecil sebagai syarat sah shalat.", "ar": null, "img": null}, {"type": "bs", "subject": "PAI", "cat": "Fiqih", "level": "Rendah", "q": "Tayamum boleh dilakukan sebagai pengganti wudu apabila seseorang sakit dan tidak boleh terkena air.", "val": true, "hint": "Benar. Tayamum dibolehkan ketika ada uzur syar'i seperti sakit yang tidak memungkinkan bersentuhan dengan air, atau ketika tidak ada air.", "ar": null, "img": null}, {"type": "pg", "subject": "PAI", "cat": "Fiqih", "level": "Sedang", "q": "Mengingat Allah melalui bacaan tasbih, tahmid, dan takbir disebut ...", "opts": ["Zikir", "Doa", "Iktikaf", "Tilawah"], "ans": 0, "hint": "Zikir adalah kegiatan mengingat Allah dengan bacaan tertentu seperti tasbih, tahmid, dan takbir.", "ar": null, "img": null}, {"type": "pg", "subject": "PAI", "cat": "Fiqih", "level": "HOTS", "q": "Setelah menyelesaikan shalat fardu, seorang siswa terburu-buru pergi tanpa berdoa. Nilai penting yang terlewat dari kebiasaannya ini adalah ...", "opts": ["Tidak ada yang terlewat, doa setelah shalat tidak penting", "Kesempatan memohon kebaikan dan keberkahan kepada Allah setelah beribadah", "Kewajiban tambahan yang memberatkan", "Doa hanya untuk orang dewasa"], "ans": 1, "hint": "Doa setelah shalat adalah sunnah yang bernilai untuk memohon kebaikan dan keberkahan; melewatkannya berarti kehilangan kesempatan berharga tersebut.", "ar": null, "img": null}, {"type": "pg", "subject": "PAI", "cat": "Fiqih", "level": "HOTS", "q": "Shalat sunnah yang dikerjakan sebelum atau sesudah shalat fardu disebut shalat ...", "opts": ["Rawatib", "Tarawih", "Witir", "Istikharah"], "ans": 0, "hint": "Shalat rawatib adalah shalat sunnah yang mengiringi shalat fardu, baik sebelum (qabliyah) maupun sesudah (ba'diyah).", "ar": null, "img": null}, {"type": "pg", "subject": "PAI", "cat": "Fiqih", "level": "HOTS", "q": "Seorang anak laki-laki berusia 12 tahun bertanya apakah ia sudah wajib melaksanakan shalat Jumat. Jawaban yang tepat adalah ...", "opts": ["Wajib jika sudah balig, sebelum balig dianjurkan untuk berlatih", "Wajib sejak lahir", "Tidak wajib selamanya", "Hanya wajib bagi orang dewasa di atas 40 tahun"], "ans": 0, "hint": "Shalat Jumat wajib bagi laki-laki muslim yang sudah balig; sebelum balig, anak dianjurkan berlatih agar terbiasa ketika dewasa nanti.", "ar": null, "img": null}, {"type": "pg", "subject": "PAI", "cat": "Fiqih", "level": "Sedang", "q": "Shalat sunnah yang dikerjakan pada sepertiga malam terakhir disebut shalat ...", "opts": ["Tahajud", "Duha", "Rawatib", "Jumat"], "ans": 0, "hint": "Shalat Tahajud dikerjakan pada sepertiga malam terakhir setelah bangun tidur.", "ar": null, "img": null}, {"type": "bs", "subject": "PAI", "cat": "Fiqih", "level": "Rendah", "q":
